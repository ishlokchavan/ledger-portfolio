        : 'No dated milestone gets you there yet — some payments still need due dates.';
      var need = Math.max(0, resale.reqPct * Number(p.total_unit_price_aed||0) - Number(p.total_paid_aed||0));
      resaleCard = '<div class="gauge"><div class="gauge-track"><div class="gauge-fill" style="width:'+paidP*100+'%"></div><div class="gauge-mark" style="left:'+req*100+'%"><span>NOC '+fmtPct(resale.reqPct)+'</span></div></div>' +
        '<div class="gauge-scale"><span>0%</span><span>'+fmtPct(resale.paidPct)+' paid</span><span>100%</span></div></div>' +
        '<div class="callout'+(resale.eligible?' good':'')+'" style="margin-top:16px"><span class="c-ico">'+icon('resale','',18)+'</span><div><b>'+(resale.eligible ? 'Resale ready' : 'Not yet eligible')+'</b><p>'+fcText+(resale.eligible ? '' : ' About '+fmtMoney(need)+' more to pay.')+'</p></div></div>';
    }

    // Key dates
    var kd = [];
    if(p.purchase_date) kd.push({ d:p.purchase_date, t:'Purchased', s:fmtDate(p.purchase_date), c:'done' });
    kd.push({ d:TODAY.getFullYear()+'-'+pad2(TODAY.getMonth()+1)+'-'+pad2(TODAY.getDate()), t:'Today', s:fmtDate(TODAY.getFullYear()+'-'+pad2(TODAY.getMonth()+1)+'-'+pad2(TODAY.getDate())), c:'now', sortLast:false });
    var od = ms.filter(function(m){ return milestoneState(m) === 'overdue'; });
    od.forEach(function(m){ kd.push({ d:m.due_date, t:m.milestone_event, s:'Overdue · '+fmtDate(m.due_date), c:'bad' }); });
    if(nm && milestoneState(nm) !== 'overdue') kd.push({ d:nm.due_date, t:nm.milestone_event, s:'Next payment · '+fmtDate(nm.due_date), c:milestoneState(nm)==='soon'?'warn':'' });
    if(fc && fc.date) kd.push({ d:fc.date, t:'Resale-eligible (forecast)', s:fmtDate(fc.date), c:'faint' });
    if(p.handover_date) kd.push({ d:p.handover_date, t:'Handover', s:fmtDate(p.handover_date)+' · '+relMonths(p.handover_date), c:daysUntil(p.handover_date) < 0 ? 'done' : '' });
    kd.sort(function(a,b){ return a.d < b.d ? -1 : a.d > b.d ? 1 : (a.c==='now' ? -1 : 1); });
    var kdHtml = '<div class="kd">' + kd.map(function(k){ return '<div class="kd-item '+(k.c||'')+'"><span class="kd-dot"></span><div><div class="t">'+esc(k.t)+'</div><div class="s">'+esc(k.s)+'</div></div></div>'; }).join('') + '</div>';

      (p.remarks ? '<div class="note"><b style="color:var(--ink)">Remarks</b><br>'+esc(p.remarks)+'</div>' : '') + '</section>' : '';

    return '<div class="d-cols">' +
      '<div class="stackc">' + nextCard + journeyCard + '</div>' +
      '<div class="stackc"><section class="card"><div class="section-h">'+icon('resale','',14)+' Resale readiness</div><div style="padding-bottom:4px">'+resaleCard+'</div></section>' +
        '<section class="card desk-only"><div class="section-h">'+icon('calendar','',14)+' Key dates</div>'+kdHtml+'</section>' + notes + '</div></div>';
  }

  function renderSchedule(p, ms){
    if(!ms.length) return '<div class="card">'+emptyState('calendar','No milestones on file','Payment milestones for this unit will show up here once they are added.')+'</div>';

    var order = [['overdue','Overdue'],['soon','Due in the next 30 days'],['upcoming','Later'],['undecided','Date to be confirmed'],['paid','Paid']];

        var pillTxt = st === 'overdue' ? Math.abs(d)+'d overdue' : (isNext ? relDays(d) : (st === 'soon' ? relDays(d) : ''));

          '<div class="m-more">' +
            '<div><div class="k">Due date</div><div class="v">'+(m.due_date ? fmtDate(m.due_date) : 'Not confirmed')+'</div></div>' +

      return '<details class="card grp '+o[0]+'"'+(o[0]==='paid' ? '' : ' open')+'><summary><span class="g-dot"></span><span class="g-t">'+o[1]+'</span><span class="g-n">'+list.length+'</span><span class="g-sum">'+fmtMoney(sumAmt(list))+'</span><span class="g-chev">'+icon('chevron','',18)+'</span></summary>'+rowsHtml+'</details>';

  function renderFinancials(p, ms){

    if(fmtPsf(p.ppsf_plot)) price.push(['Price per sqft (plot)', fmtPsf(p.ppsf_plot)]);
    if(p.accelerated_payment_aed != null && Number(p.accelerated_payment_aed) > 0) price.push(['Accelerated payment', fmtPct(p.accelerated_payment_pct)+' · '+fmtMoney(p.accelerated_payment_aed)]);

    var sched = ms.length ? [['Installments (ex-VAT)', fmtMoney(t.amount)], ['VAT', fmtMoney(t.vat)], ['Total payable', fmtMoney(t.total), true], ['Paid to date', fmtMoney(t.paid)], ['Outstanding', fmtMoney(t.out), true]] : [];

    var phases = [['During construction', p.equity_construction_pct, p.equity_construction_aed, 'var(--accent)'],['On handover', p.equity_handover_pct, p.equity_handover_aed, 'var(--info)'],['Post-handover', p.equity_posthandover_pct, p.equity_posthandover_aed, 'var(--warn)']]

      phases.map(function(r){ return '<div><span><span class="dot" style="background:'+r[3]+'"></span>'+r[0]+'</span><b>'+fmtPct(r[1])+' · '+fmtMoney(r[2])+'</b></div>'; }).join('') + '</div></div></section>' : '';

    var owners = [[p.owner1_name, p.owner1_pct],[p.owner2_name, p.owner2_pct]].filter(function(o){ return o[0]; });

      owners.map(function(o){ var f = Number(o[1]||0); return '<tr><td><b>'+esc(o[0])+'</b></td><td class="num">'+Math.round(f*100)+'%</td><td class="num">'+fmtMoney(Number(p.total_paid_aed||0)*f)+'</td><td class="num">'+fmtMoney(Number(p.total_pending_aed||0)*f)+'</td>'+(nm?'<td class="num">'+fmtMoney(mAmt(nm)*f)+'</td>':'')+'</tr>'; }).join('') +

    return '<div class="d-cols even"><div class="stackc">' +
      '<section class="card"><div class="section-h">'+icon('money','',14)+' Price</div>'+kvRows(price)+'</section>' +

  /* ---------------- PAYMENTS ---------------- */
  var PAY_TABS = [
    { id:'overdue', label:'Overdue', empty:['check','Nothing overdue','You are fully up to date on payments.'] },
    { id:'soon', label:'Due soon', empty:['calendar','Nothing due in 30 days','No payments are falling due in the next month.'] },
    { id:'upcoming', label:'Upcoming', empty:['calendar','Nothing further out','There are no dated milestones beyond the next 30 days.'] },
    { id:'undecided', label:'Date TBC', empty:['check','Every milestone is dated','Nothing is waiting on a confirmed due date.'] },
    { id:'paid', label:'Paid', empty:['wallet','No payments recorded','Paid milestones will be listed here.'] }
  ];
  var RANGES = [['all','All time'],['month','This month'],['last30','Last 30 days'],['next30','Next 30 days'],['next90','Next 90 days'],['quarter','This quarter'],['year','This year'],['custom','Custom range…']];
  function isoDate(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function rangeBounds(){
    var r = state.payRange, t = TODAY, y = t.getFullYear(), m = t.getMonth(), q;
    if(r === 'month') return [isoDate(new Date(y, m, 1)), isoDate(new Date(y, m+1, 0))];
    if(r === 'last30') return [isoDate(addDays(t,-30)), isoDate(t)];
    if(r === 'next30') return [isoDate(t), isoDate(addDays(t,30))];
    if(r === 'next90') return [isoDate(t), isoDate(addDays(t,90))];
    if(r === 'quarter'){ q = Math.floor(m/3)*3; return [isoDate(new Date(y, q, 1)), isoDate(new Date(y, q+3, 0))]; }
    if(r === 'year') return [y + '-01-01', y + '-12-31'];
    if(r === 'custom' && (state.payFrom || state.payTo)) return [state.payFrom || '0000-01-01', state.payTo || '9999-12-31'];
    return null;
  }
  function rangeLabel(){
    var b = rangeBounds(); if(!b) return '';
    if(state.payRange === 'custom'){
      if(state.payFrom && state.payTo) return fmtDate(state.payFrom) + ' – ' + fmtDate(state.payTo);
      return state.payFrom ? 'From ' + fmtDate(state.payFrom) : 'Until ' + fmtDate(state.payTo);
    }
    return fmtDate(b[0]) + ' – ' + fmtDate(b[1]);
  }
  function paymentsFiltered(){
    var q = state.payQuery.trim().toLowerCase(), bounds = rangeBounds();
    return state.milestones.filter(function(m){
      if(bounds && (!m.due_date || m.due_date < bounds[0] || m.due_date > bounds[1])) return false;
      if(state.payProp !== 'all' && m.property_id !== state.payProp) return false;
      if(q){
        var p = propOf(m.property_id);
        if([m.milestone_event, p ? p.project_name : '', m.remarks].join(' ').toLowerCase().indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function paymentsResults(){
    var b = bucketMilestones(paymentsFiltered());
    var tab = PAY_TABS.some(function(t){ return t.id === state.payTab; }) ? state.payTab : 'soon';
    var list = b[tab].slice().sort(byDue); if(tab === 'paid') list.reverse();
    var def = PAY_TABS.filter(function(t){ return t.id === tab; })[0];
    if(!list.length){
      var filtered = state.payQuery || state.payRange !== 'all' || state.payProp !== 'all';
      return '<div class="card">'+ (filtered ? emptyState('search','No payments match', (tab === 'undecided' && state.payRange !== 'all') ? 'Milestones without a date can only be listed under “All time”.' : 'Nothing in this tab fits the current search or filters.','<button class="btn btn-ghost btn-sm" data-act="clear-pay-filters">Clear filters</button>') : emptyState(def.empty[0], def.empty[1], def.empty[2])) + '</div>';
    }
    var meta = '<div class="results-meta"><span>'+plural(list.length,'payment')+' · <b class="mono" style="color:var(--ink)">'+fmtMoney(sumAmt(list))+'</b>'+(rangeLabel() ? ' · <span class="rl">'+esc(rangeLabel())+'</span>' : '')+(rangeBounds() && state.payTab === 'undecided' ? '' : '')+'</span>' +
      '<span class="desk-only" style="gap:14px">'+(state.payTab === 'paid' ? '' : '<button class="link-btn" data-act="ics-list">'+icon('calendar','',14,2)+' Add to calendar</button>')+'<button class="link-btn" data-act="export">'+icon('download','',14,2)+' Export CSV</button></span></div>';

    if(state.payView === 'table'){
      var rows = list.map(function(m){
        var p = propOf(m.property_id), st = milestoneState(m), d = daysUntil(m.due_date);
        return '<tr class="clickable" data-act="open-prop" data-id="'+esc(m.property_id)+'" data-goto-sched="1"><td><b>'+esc(p?p.project_name:'')+'</b></td><td class="wrap">'+esc(m.milestone_event)+'</td>' +
          '<td>'+(m.due_date ? fmtDate(m.due_date) : 'Not confirmed')+'</td><td><span class="st '+st+'">'+(st==='overdue' ? Math.abs(d)+'d overdue' : STATE_LABEL[st])+'</span></td>' +
          '<td class="num">'+fmtMoney(m.amount_aed)+'</td><td class="num">'+fmtMoney(m.vat_aed)+'</td><td class="num">'+fmtMoney(m.total_aed)+'</td></tr>';
      }).join('');
      var tot = list.reduce(function(a,m){ a.amt += Number(m.amount_aed||0); a.vat += Number(m.vat_aed||0); a.tot += Number(m.total_aed||0); return a; }, { amt:0, vat:0, tot:0 });
      return meta + '<div class="sheet-wrap"><table class="sheet wide" style="min-width:820px"><thead><tr><th>Property</th><th>Milestone</th><th>Due</th><th>Status</th><th class="num">Amount</th><th class="num">VAT</th><th class="num">Total</th></tr></thead><tbody>'+rows+'</tbody>' +
        '<tfoot><tr><td colspan="4">Total</td><td class="num">'+fmtMoney(tot.amt)+'</td><td class="num">'+fmtMoney(tot.vat)+'</td><td class="num">'+fmtMoney(tot.tot)+'</td></tr></tfoot></table></div>';
    }

    // grouped by month
    var groups = [], map = {};
    list.forEach(function(m){
      var key = m.due_date ? m.due_date.slice(0,7) : 'none';
      if(!map[key]){
        var label = key === 'none' ? 'No date yet' : new Date(m.due_date + 'T00:00:00').toLocaleDateString('en-GB', { month:'long', year:'numeric' });
        map[key] = { label:label, items:[] }; groups.push(map[key]);
      }
      map[key].items.push(m);
    });
    return meta + '<div class="card list-card">' + groups.map(function(g){
      return '<div class="month-head"><span>'+esc(g.label)+' · '+plural(g.items.length,'payment')+'</span><span class="sum">'+fmtMoney(sumAmt(g.items))+'</span></div>' + g.items.map(function(m){ return paymentRow(m, true); }).join('');
    }).join('') + '</div>';
  }

  function exportCsv(){

    function q(v){ v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }

    } else if(id === 'paySearch'){
      state.payQuery = e.target.value;
      clearTimeout(debounceT); debounceT = setTimeout(refreshPayments, 90);
    }
  });
  document.addEventListener('change', function(e){
    var id = e.target.id, v = e.target.value;
    if(id === 'propSort'){ state.propSort = v; var r = document.getElementById('propResults'); if(r) r.innerHTML = propertyResults(); }
    else if(id === 'secondarySelect'){ setSecondary(v); }
    else if(id === 'payProp'){ state.payProp = v; refreshPayments(); }
    else if(id === 'payRange'){ state.payRange = v; if(v === 'custom' && !state.payFrom && !state.payTo){ state.payFrom = isoDate(TODAY); state.payTo = isoDate(addDays(TODAY, 30)); } render(); }
    else if(id === 'payFrom' || id === 'payTo'){ if(id === 'payFrom') state.payFrom = v; else state.payTo = v; state.payRange = 'custom'; render(); var b = document.querySelector('#sheetBack .sh-custom'); if(b){ drawSheet(); } }
    else if(id === 'portfolioSwitch' || id === 'portfolioSwitchM'){ switchClient(v); }
  });

  document.addEventListener('mouseover', function(e){ var c = e.target.closest && e.target.closest('#cfChart .cf-col'); if(c) cfShow(Number(c.getAttribute('data-i'))); });
  document.addEventListener('mouseout', function(e){ var c = e.target.closest && e.target.closest('#cfChart .cf-col'); if(c && !(e.relatedTarget && c.contains(e.relatedTarget))) cfShow(state.cfSel); });
  document.addEventListener('focusin', function(e){ var c = e.target.closest && e.target.closest('#cfChart .cf-col'); if(c) cfShow(Number(c.getAttribute('data-i'))); var d = e.target.closest && e.target.closest('.jdot'); if(d) jShow(d.closest('.jchart'), Number(d.getAttribute('data-i'))); });

  /* payment-journey scrubber: hover / drag / tap anywhere on the chart snaps to the nearest milestone */
  function jPts(chart){ try { return JSON.parse(chart.getAttribute('data-pts')); } catch(e){ return []; } }
  function jShow(chart, i){
    if(!chart) return; var pts = jPts(chart), pt = pts[i], cross = chart.querySelector('.jcross'), tip = chart.querySelector('.jtip');
    if(!pt){ cross.hidden = true; tip.hidden = true; return; }
    chart.querySelectorAll('.jdot').forEach(function(d){ d.classList.toggle('hot', Number(d.getAttribute('data-i')) === i); });
    cross.style.left = pt.x + '%'; cross.hidden = false;
    var stTxt = pt.st === 'paid' ? 'Paid' : pt.st === 'overdue' ? 'Overdue' : 'Scheduled';
    tip.innerHTML = '<b>'+esc(pt.t)+'</b><span>'+esc(fmtDate(pt.d))+' · '+stTxt+'</span><span class="row"><i>'+(pt.st === 'paid' ? 'Paid' : 'Due')+'</i> '+esc(fmtMoney(pt.amt))+'</span><span class="row"><i>Cumulative</i> '+pt.cum+'% · '+esc(fmtCompact(pt.cumAmt))+'</span>';
    tip.hidden = false;
    var w = chart.clientWidth, left = pt.x / 100 * w, tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(w - tw, left - tw / 2)) + 'px';
    tip.style.top = Math.max(-8, pt.y / 100 * chart.clientHeight - tip.offsetHeight - 14) + 'px';
  }
  function jNearest(chart, clientX){
    var r = chart.getBoundingClientRect(), px = (clientX - r.left) / r.width * 100, pts = jPts(chart), best = -1, bd = 1e9;
    pts.forEach(function(pt, i){ var d = Math.abs(pt.x - px); if(d < bd){ bd = d; best = i; } });
    return best;
  }
  document.addEventListener('pointermove', function(e){ var c = e.target.closest && e.target.closest('.jchart'); if(c && (e.pointerType !== 'touch' || e.buttons)) jShow(c, jNearest(c, e.clientX)); });
  document.addEventListener('pointerdown', function(e){
    var c = e.target.closest && e.target.closest('.jchart');
    document.querySelectorAll('.jchart').forEach(function(x){ if(x !== c){ x.querySelector('.jtip').hidden = true; x.querySelector('.jcross').hidden = true; x.querySelectorAll('.jdot.hot').forEach(function(d){ d.classList.remove('hot'); }); } });
    if(c) jShow(c, jNearest(c, e.clientX));
  });
  document.addEventListener('pointerleave', function(e){ var c = e.target.closest && e.target.closest('.jchart'); if(c && e.pointerType === 'mouse'){ c.querySelector('.jtip').hidden = true; c.querySelector('.jcross').hidden = true; } }, true);

  var chord = null, chordT = null;
  document.addEventListener('keydown', function(e){
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); pal.open ? closePalette() : openPalette(); return; }
    if(sheet.type && e.key === 'Escape'){ e.preventDefault(); closeSheet(); return; }
    if(pal.open){
      if(e.key === 'Escape'){ e.preventDefault(); closePalette(); }
      else if(e.key === 'ArrowDown'){ e.preventDefault(); pal.idx = (pal.idx + 1) % Math.max(1, pal.items.length); paletteDraw(); }
      else if(e.key === 'ArrowUp'){ e.preventDefault(); pal.idx = (pal.idx - 1 + pal.items.length) % Math.max(1, pal.items.length); paletteDraw(); }
      else if(e.key === 'Enter'){ e.preventDefault(); paletteRun(pal.idx); }
      else if(e.key === 'Tab'){ e.preventDefault(); }
      return;
    }
    var tag = (e.target.tagName || '').toLowerCase();
    if(tag === 'input' || tag === 'textarea' || tag === 'select' || e.metaKey || e.ctrlKey || e.altKey || !state.profile) return;
    var k = e.key.toLowerCase();
    if(chord === 'g'){
      chord = null; clearTimeout(chordT);
      if(k === 'o') go(''); else if(k === 'p') go('properties'); else if(k === 'y') go('payments'); else if(k === 'a') go('account');
      return;
    }
    if(k === 'g'){ chord = 'g'; clearTimeout(chordT); chordT = setTimeout(function(){ chord = null; }, 900); }
    else if(k === 'h') setPrivacy(!state.privacy);
    else if(k === 'c') setCurrency(state.currency === 'AED' ? state.secondary : 'AED');
    else if(k === '/'){ var s = document.getElementById('propSearch') || document.getElementById('paySearch'); if(s){ e.preventDefault(); s.focus(); } else { e.preventDefault(); openPalette(); } }
  });

  /* animate cash-flow bars after the first paint (they start collapsed) */
  var cfObserver = new MutationObserver(function(){
    var bars = document.querySelectorAll('#cfChart .b[data-h]');
    if(!bars.length) return;
    var need = false; bars.forEach(function(b){ if(b.style.height !== b.getAttribute('data-h') + '%') need = true; });
    if(!need) return;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ bars.forEach(function(b){ b.style.height = b.getAttribute('data-h') + '%'; }); }); });
  });
  cfObserver.observe(app, { childList:true, subtree:true });

  /* pull-to-refresh: installed apps have no browser reload button */
  (function(){
    if(!isStandalone()) return;
    var ind = document.createElement('div'); ind.className = 'ptr'; ind.innerHTML = icon('refresh','',20,2); document.body.appendChild(ind);
    var y0 = null, dy = 0;
    document.addEventListener('touchstart', function(e){ y0 = (window.scrollY <= 0 && !sheet.type && !pal.open && e.touches.length === 1) ? e.touches[0].clientY : null; dy = 0; }, { passive:true });
    document.addEventListener('touchmove', function(e){
      if(y0 === null) return; dy = e.touches[0].clientY - y0;
      if(dy > 0 && window.scrollY <= 0){ var k = Math.min(dy, 120); ind.style.opacity = Math.min(1, k / 80); ind.style.transform = 'translateY(' + (k - 70) + 'px) rotate(' + (k * 3) + 'deg)'; }
    }, { passive:true });
    document.addEventListener('touchend', function(){
      if(y0 !== null && dy > 90){ ind.classList.add('spin'); ind.style.opacity = 1; ind.style.transform = 'translateY(20px)';
        Promise.resolve(refreshData(true)).then(function(){ ind.classList.remove('spin'); ind.style.opacity = 0; ind.style.transform = 'translateY(-70px)'; }); }
      else { ind.style.opacity = 0; ind.style.transform = 'translateY(-70px)'; }
      y0 = null; dy = 0;
    }, { passive:true });
  })();

  window.addEventListener('online', function(){ if(state.profile) toast('Back online'); });
  window.addEventListener('offline', function(){ toast('You are offline — figures may be out of date'); });
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); });
  }

  init();
})();
</script>
</body>
</html>
