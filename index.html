<script>
/* Runs before first paint: mark standalone (installed) mode and pick the iOS status-bar style for the saved theme. */
(function(){
  try {
    var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    if(standalone) document.documentElement.classList.add('standalone');
    var t = localStorage.getItem('ledger_theme') || 'light';
    var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    var m = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if(m) m.setAttribute('content', dark ? 'black-translucent' : 'default');
    if(dark){ var tc = document.querySelector('meta[name="theme-color"]'); if(tc) tc.setAttribute('content', '#080e0d'); }
  } catch(e){}
})();
</script>
<title>Ledger</title>
<script src="/vendor/supabase.js"></script>

<style>
  /* =====================================================================
     DESIGN TOKENS
     ===================================================================== */
  :root{
    --bg:#f7f7f5; --surface:#ffffff; --surface-2:#f2f2ef; --surface-3:#e8e8e4; --border:#e6e6e2; --border-strong:#d3d3ce;
    --ink:#131816; --ink-dim:#5a625f; --ink-faint:#8a918e;
    --accent:#0f7d72; --accent-strong:#0b6259; --accent-ink:#ffffff; --accent-soft:#e0f1ee;
    --good:#1c8a4a; --good-soft:#e3f5e9;
    --warn:#a06a14; --warn-soft:#faf0d9;
    --bad:#c23b32; --bad-soft:#fbe8e5;
    --info:#3b6fb6; --info-soft:#e6eefa;
    --hero-a:#1a2321; --hero-b:#111716; --hero-ink:#f4f8f7; --hero-dim:rgba(244,248,247,.62);
    --shadow-sm:0 1px 2px rgba(16,24,22,.05);
    --shadow:0 1px 2px rgba(16,24,22,.04);
    --shadow-md:0 2px 4px rgba(16,24,22,.04), 0 8px 20px -10px rgba(16,24,22,.14);
    --shadow-lg:0 2px 6px rgba(16,24,22,.06), 0 24px 60px -20px rgba(16,24,22,.28);
    --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px;
    --ease:cubic-bezier(.22,.8,.24,1);
    --sidebar-w:264px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#080e0d; --surface:#0e1816; --surface-2:#142320; --surface-3:#1b2e2a; --border:#1f302d; --border-strong:#2c433e;
      --ink:#edf3f1; --ink-dim:#95a8a3; --ink-faint:#61756f;
      --accent:#3fd6c4; --accent-strong:#6fe6d7; --accent-ink:#04201c; --accent-soft:#0f2a26;
      --good:#52c081; --good-soft:#102a1a;
      --warn:#e3ac41; --warn-soft:#2b2110;
      --bad:#ea6d64; --bad-soft:#2d1512;
      --info:#7aa7e6; --info-soft:#12213a;
      --hero-a:#0d4a43; --hero-b:#07161a;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
      --shadow-md:0 2px 4px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
      --shadow-lg:0 2px 6px rgba(0,0,0,.35), 0 24px 60px -20px rgba(0,0,0,.7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#080e0d; --surface:#0e1816; --surface-2:#142320; --surface-3:#1b2e2a; --border:#1f302d; --border-strong:#2c433e;
    --ink:#edf3f1; --ink-dim:#95a8a3; --ink-faint:#61756f;
    --accent:#3fd6c4; --accent-strong:#6fe6d7; --accent-ink:#04201c; --accent-soft:#0f2a26;
    --good:#52c081; --good-soft:#102a1a;
    --warn:#e3ac41; --warn-soft:#2b2110;
    --bad:#ea6d64; --bad-soft:#2d1512;
    --info:#7aa7e6; --info-soft:#12213a;
    --hero-a:#0d4a43; --hero-b:#07161a;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    --shadow-md:0 2px 4px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
    --shadow-lg:0 2px 6px rgba(0,0,0,.35), 0 24px 60px -20px rgba(0,0,0,.7);
    color-scheme: dark;
  }

  /* =====================================================================
     BASE
     ===================================================================== */
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; min-height:100%; }
  body{ background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
  h1,h2,h3,h4,.serif{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; text-wrap:balance; margin:0; font-weight:700; letter-spacing:-.022em; }
  .mono{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-variant-numeric:tabular-nums; }
  p{ margin:0; }
  a{ color:var(--accent); }
  button{ font-family:inherit; color:inherit; }
  input,select{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); color:var(--ink); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  [hidden]{ display:none !important; }
  .icon-btn.spin svg{ animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .skip-link{ position:absolute; left:12px; top:-60px; z-index:200; background:var(--accent); color:var(--accent-ink); padding:9px 14px; border-radius:8px; font-weight:600; text-decoration:none; transition:top .2s; }
  .skip-link:focus{ top:12px; }

  #app{ min-height:100vh; }
  .sect{ min-width:0; }
  .sect-label{ font-size:12px; font-weight:700; letter-spacing:.7px; text-transform:uppercase; color:var(--ink-faint); margin:24px 0 10px; }
  .grid > .sect .sect-label{ margin-top:0; }
  .g-two, .g-kpi{ margin-top:0; }
  .page-head + .grid, .grid + .grid, .grid + .sect, .sect + .sect{ margin-top:14px; }
  .desk-only{ display:none !important; }
  @media (min-width:900px){ .desk-only{ display:revert !important; } div.desk-only[style*="justify-content:flex-end"]{ display:flex !important; } .desk-only.next-foot{ display:flex !important; } .icon-btn.desk-only{ display:inline-flex !important; } }

  /* buttons */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px; border-radius:var(--r-md);
    border:1px solid transparent; background:var(--accent); color:var(--accent-ink); font-weight:600; font-size:14px; cursor:pointer;
    transition:transform .12s var(--ease), background .15s, box-shadow .15s; min-height:44px; text-decoration:none;
  }
  .btn:hover{ background:var(--accent-strong); }
  .btn:active{ transform:translateY(1px) scale(.99); }
  .btn:disabled{ opacity:.6; cursor:default; }
  .btn-block{ width:100%; }
  .btn-ghost{ background:transparent; border-color:var(--border-strong); color:var(--ink); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger{ background:transparent; border-color:var(--border-strong); color:var(--bad); }
  .btn-danger:hover{ background:var(--bad-soft); }
  .btn-sm{ padding:7px 12px; min-height:34px; font-size:12.5px; border-radius:var(--r-sm); }
  .icon-btn{
    width:40px; height:40px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface);
    color:var(--ink-dim); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
    transition:background .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .icon-btn.on{ background:var(--accent-soft); border-color:transparent; color:var(--accent); }

  /* icons */
  .ico{ flex:none; vertical-align:-3px; }
  .ico-dim{ color:var(--ink-faint); }
  .meta-ico{ display:inline-flex; align-items:center; gap:5px; }

  /* segmented control */
  .seg{ display:inline-flex; padding:3px; gap:2px; border-radius:var(--r-md); background:var(--surface-2); border:1px solid var(--border); }
  .seg button{
    border:none; background:transparent; color:var(--ink-dim); font-weight:600; font-size:12.5px; padding:0 13px; min-height:32px;
    border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:background .15s, color .15s;
  }
  .seg button:hover{ color:var(--ink); }
  .seg button.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm); }
  .seg.seg-accent button.active{ background:var(--accent); color:var(--accent-ink); }

  /* pills */
  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px;
    white-space:nowrap; letter-spacing:.1px; background:var(--surface-2); color:var(--ink-dim);
  }
  .pill.accent{ background:var(--accent-soft); color:var(--accent); }
  .pill.good{ background:var(--good-soft); color:var(--good); }
  .pill.warn{ background:var(--warn-soft); color:var(--warn); }
  .pill.bad{ background:var(--bad-soft); color:var(--bad); }
  .pill.info{ background:var(--info-soft); color:var(--info); }

  /* cards */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow); }
  .card-pad{ padding:20px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:18px 20px 0; }
  .card-title{ font-size:15px; font-family:'Inter',sans-serif; font-weight:700; letter-spacing:0; }
  .card-sub{ font-size:12.5px; color:var(--ink-dim); margin-top:2px; }
  .link-btn{ background:none; border:none; color:var(--accent); font-weight:600; font-size:12.5px; cursor:pointer; padding:4px 0; display:inline-flex; align-items:center; gap:4px; }
  .link-btn:hover{ text-decoration:underline; }

  /* progress */
  .bar{ height:8px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
  .bar > i{ display:block; height:100%; border-radius:99px; background:var(--accent); transition:width .9s var(--ease); }
  .bar.lg{ height:12px; }
  .bar.on-hero{ background:rgba(255,255,255,.14); }
  .bar.on-hero > i{ background:linear-gradient(90deg,#5eead4,#a7f3d0); }

  /* =====================================================================
     LOGIN
     ===================================================================== */
  .login{ min-height:100vh; display:grid; grid-template-columns:1fr; }
  .login-aside{
    display:none; position:relative; overflow:hidden; color:var(--hero-ink); padding:48px 56px;
    background:radial-gradient(800px 500px at 0% 0%, rgba(63,214,196,.14), transparent 60%), linear-gradient(160deg,var(--hero-a),var(--hero-b));
  }
  .login-aside::after{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:44px 44px; mask-image:radial-gradient(circle at 30% 30%, #000 0%, transparent 70%);
  }
  .login-aside > *{ position:relative; z-index:1; }
  .login-aside h2{ font-size:clamp(30px,3.2vw,44px); line-height:1.1; margin:56px 0 18px; max-width:480px; }
  .login-aside p.lead{ color:var(--hero-dim); font-size:16px; max-width:430px; line-height:1.6; }
  .login-points{ list-style:none; padding:0; margin:36px 0 0; display:flex; flex-direction:column; gap:16px; max-width:440px; }
  .login-points li{ display:flex; gap:14px; align-items:flex-start; font-size:14px; color:var(--hero-dim); line-height:1.5; }
  .login-points b{ color:var(--hero-ink); display:block; font-weight:600; }
  .lp-ico{ width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; flex:none; color:#8ff0e0; }
  .login-main{
    display:flex; align-items:center; justify-content:center; padding:32px 20px;
    background:radial-gradient(ellipse 800px 420px at 50% -10%, var(--accent-soft), transparent 65%), var(--bg);
  }
  .login-card{ width:100%; max-width:400px; }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand-mark{
    width:38px; height:38px; border-radius:11px; background:linear-gradient(145deg,var(--accent),var(--accent-strong)); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-weight:700; font-size:20px; flex:none;
    box-shadow:0 6px 16px -6px var(--accent);
  }
  .brand-name{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-weight:600; font-size:20px; letter-spacing:-.01em; line-height:1; }
  .brand-tag{ font-size:12px; color:var(--ink-faint); margin-top:3px; }
  .login-aside .brand-mark{ background:rgba(255,255,255,.14); color:#fff; box-shadow:none; border:1px solid rgba(255,255,255,.18); }
  .login-aside .brand-tag{ color:var(--hero-dim); }
  .login-mobile-brand{ margin-bottom:30px; }
  .login-title{ font-size:28px; margin-bottom:6px; }
  .login-desc{ color:var(--ink-dim); font-size:14.5px; margin-bottom:24px; line-height:1.55; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-dim); margin-bottom:7px; }
  .input-wrap{ position:relative; }
  .input{
    width:100%; padding:12px 14px; min-height:46px; border-radius:var(--r-md); border:1px solid var(--border-strong);
    background:var(--surface); color:var(--ink); font-size:15px; transition:border-color .15s, box-shadow .15s;
  }
  .input::placeholder{ color:var(--ink-faint); }
  .input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .input-wrap .icon-btn{ position:absolute; right:3px; top:3px; width:40px; height:40px; border:none; background:transparent; }
  .input-wrap.has-ico .input{ padding-left:40px; }
  .input-wrap.has-ico > .ico{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--ink-faint); pointer-events:none; }
  .form-error{ background:var(--bad-soft); color:var(--bad); font-size:13px; padding:11px 13px; border-radius:var(--r-md); margin-bottom:16px; line-height:1.4; display:flex; gap:9px; align-items:flex-start; }
  .demo{ margin-top:26px; }
  .demo-label{ font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.7px; margin-bottom:10px; display:flex; align-items:center; gap:10px; }
  .demo-label::after{ content:""; flex:1; height:1px; background:var(--border); }
  .demo-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .demo-chip{
    text-align:left; padding:12px 13px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface);
    cursor:pointer; transition:border-color .15s, transform .12s var(--ease), box-shadow .15s;
  }
  .demo-chip:hover{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .demo-chip:active{ transform:scale(.98); }
  .demo-chip b{ display:block; font-size:13px; }
  .demo-chip span{ font-size:11.5px; color:var(--ink-faint); }
  .login-foot{ margin-top:28px; font-size:12px; color:var(--ink-faint); display:flex; gap:7px; align-items:center; line-height:1.5; }

  /* =====================================================================
     APP SHELL
     ===================================================================== */
  .shell{ min-height:100vh; }
  .sidebar{ display:none; }
  .content{ min-width:0; }
  .topbar{
    position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px; min-height:60px;
    padding:max(10px, env(safe-area-inset-top)) 16px 10px;
    background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px);
    border-bottom:1px solid var(--border);
  }
  .topbar .brand-mark{ width:30px; height:30px; font-size:16px; border-radius:9px; }
  .topbar .brand-name{ font-size:17px; }
  .topbar-title{ display:none; font-size:20px; }
  .topbar-crumbs{ display:none; align-items:center; gap:8px; min-width:0; }
  .topbar-spacer{ flex:1; }
  .tools{ display:flex; align-items:center; gap:8px; }
  .tools .seg button{ padding:0 11px; }
  .search-trigger{
    display:none; align-items:center; gap:10px; min-height:40px; padding:0 8px 0 13px; border-radius:var(--r-md);
    border:1px solid var(--border); background:var(--surface); color:var(--ink-faint); cursor:pointer; font-size:13px; min-width:210px;
  }
  .search-trigger:hover{ border-color:var(--border-strong); }
  .search-trigger kbd, .kbd{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:11px; padding:2px 6px; border-radius:6px; border:1px solid var(--border-strong);
    background:var(--surface-2); color:var(--ink-dim); margin-left:auto;
  }
  .client-strip{ display:flex; align-items:center; gap:10px; margin-bottom:16px; padding:10px 12px; border-radius:var(--r-md); background:var(--accent-soft); color:var(--accent); font-weight:600; font-size:12.5px; }
  .client-strip select{ flex:1; min-width:0; background:transparent; border:none; color:inherit; font-weight:700; font-size:13.5px; cursor:pointer; }

  .page{ padding:20px 16px calc(96px + env(safe-area-inset-bottom)); max-width:1180px; margin:0 auto; }
  .page.enter > *{ animation:rise .5s var(--ease) both; }
  .page.enter > *:nth-child(2){ animation-delay:.04s; } .page.enter > *:nth-child(3){ animation-delay:.08s; }
  .page.enter > *:nth-child(4){ animation-delay:.12s; } .page.enter > *:nth-child(5){ animation-delay:.16s; }
  .page.enter > *:nth-child(6){ animation-delay:.2s; }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }

  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
  .page-head h1{ font-size:clamp(24px,4vw,32px); line-height:1.15; }
  .page-head p{ color:var(--ink-dim); margin-top:5px; font-size:14px; }

  /* bottom nav (mobile) */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; justify-content:space-around;
    background:color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter:saturate(1.4) blur(16px); -webkit-backdrop-filter:saturate(1.4) blur(16px);
    border-top:1px solid var(--border); padding:6px 8px max(8px, env(safe-area-inset-bottom));
  }
  .nav-btn{
    position:relative; flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-faint); font-size:10.5px; font-weight:600; padding:7px 4px 5px; border-radius:12px; cursor:pointer; min-height:52px;
    transition:color .15s;
  }
  .nav-btn .nav-ico{ width:22px; height:22px; transition:transform .2s var(--ease); }
  .nav-btn.active{ color:var(--accent); }
  .nav-btn.active .nav-ico{ transform:translateY(-1px) scale(1.08); }
  .nav-btn.active::before{ content:""; position:absolute; top:-7px; left:50%; width:22px; height:3px; margin-left:-11px; border-radius:0 0 4px 4px; background:var(--accent); }
  .nav-badge{ position:absolute; top:3px; left:calc(50% + 6px); min-width:16px; height:16px; padding:0 4px; border-radius:99px; background:var(--bad); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }

  /* sidebar internals */
  .sb-brand{ padding:6px 8px 20px; }
  .sb-nav{ display:flex; flex-direction:column; gap:3px; }
  .sb-link{
    position:relative; display:flex; align-items:center; gap:12px; padding:0 12px; min-height:42px; border-radius:var(--r-md); border:none; background:none;
    color:var(--ink-dim); font-weight:600; font-size:14px; cursor:pointer; text-align:left; width:100%; transition:background .15s, color .15s;
  }
  .sb-link:hover{ background:var(--surface-2); color:var(--ink); }
  .sb-link.active{ background:var(--accent-soft); color:var(--accent); }
  .sb-link .badge{ margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:99px; background:var(--bad-soft); color:var(--bad); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }

  /* cash-flow chart */

  .tab .n{ font-size:11px; font-weight:700; background:var(--surface-3); color:var(--ink-dim); border-radius:99px; padding:1px 7px; }
  .d-cols{ display:grid; gap:14px; grid-template-columns:1fr; align-items:start; }
  .stackc{ display:flex; flex-direction:column; gap:14px; min-width:0; }
  .section-h{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--ink-faint); padding:18px 20px 6px; display:flex; align-items:center; gap:7px; }
  .kv{ padding:0 20px 14px; }
  .kv-row{ display:flex; justify-content:space-between; gap:16px; padding:11px 0; border-top:1px solid var(--border); font-size:13.5px; }
  .kv-row:first-child{ border-top:none; }
  .kv-row .k{ color:var(--ink-dim); }
  .kv-row .v{ font-weight:600; text-align:right; }
  .kv-row.total{ font-weight:700; } .kv-row.total .k{ color:var(--ink); }
  .owner-chip{ display:inline-flex; align-items:center; gap:8px; background:var(--surface-2); border-radius:99px; padding:5px 12px 5px 5px; font-size:13px; font-weight:600; margin:0 8px 8px 0; }
  .owner-chip .av{ width:26px; height:26px; border-radius:50%; background:var(--ink); color:var(--bg); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
  .owner-chip span{ color:var(--ink-dim); font-weight:500; }
  .callout{ margin:4px 20px 18px; border-radius:var(--r-md); padding:14px 16px; background:var(--surface-2); display:flex; gap:12px; align-items:flex-start; }
  .callout .c-ico{ width:34px; height:34px; border-radius:10px; background:var(--surface-3); color:var(--ink-dim); display:flex; align-items:center; justify-content:center; flex:none; }
  .callout.good{ background:var(--good-soft); } .callout.good .c-ico{ background:transparent; color:var(--good); }
  .callout b{ display:block; font-size:14px; }
  .callout p{ font-size:13px; color:var(--ink-dim); margin-top:3px; line-height:1.5; }
  .callout.good b{ color:var(--good); } .callout.good p{ color:var(--ink); }
  .note{ padding:0 20px 18px; font-size:13.5px; color:var(--ink-dim); line-height:1.6; }
  .stack-bar{ display:flex; height:12px; border-radius:99px; overflow:hidden; background:var(--surface-3); gap:2px; }
  .stack-bar i{ display:block; height:100%; }
  .stack-legend{ display:flex; flex-direction:column; gap:8px; margin-top:14px; font-size:13px; color:var(--ink-dim); }
  .stack-legend > div{ display:flex; justify-content:space-between; gap:12px; }
  .stack-legend b{ color:var(--ink); font-weight:600; }

  /* next-up card */
  .nextup{ padding:20px; }
  .nextup-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .nextup h3{ font-size:17px; margin-top:12px; line-height:1.3; }
  .nextup .when{ color:var(--ink-dim); font-size:13.5px; margin-top:4px; }
  .nextup .amt{ font-size:28px; font-weight:800; letter-spacing:-.03em; margin-top:16px; }
  .nextup .amt small{ font-size:12.5px; font-weight:500; color:var(--ink-dim); letter-spacing:0; margin-left:6px; }
  .nextup-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }

  /* journey chart */
  .journey{ padding:6px 20px 18px; }
  .jchart{ position:relative; height:190px; margin:30px 0 0 34px; }
  .jchart svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .jgrid{ position:absolute; left:0; right:0; height:0; border-top:1px solid var(--border); }
  .jgrid span{ position:absolute; left:-34px; top:-8px; width:28px; text-align:right; font-size:10.5px; color:var(--ink-faint); font-weight:600; }
  .jline{ position:absolute; top:0; bottom:0; width:0; border-left:1.5px dashed var(--ink-faint); }
  .jline span{ position:absolute; top:-18px; left:0; transform:translateX(-50%); font-size:10.5px; font-weight:700; color:var(--ink); white-space:nowrap; }
  .jline.ho{ border-color:var(--info); } .jline.ho span{ color:var(--info); }
  .jline.today{ border-left-style:solid; border-color:var(--ink); }
  .jthr{ position:absolute; left:0; right:0; border-top:1.5px dashed var(--good); }
  .jthr span{ position:absolute; right:0; top:-19px; font-size:10.5px; font-weight:700; color:var(--good); background:var(--surface); padding:0 4px; }
  .jchart{ touch-action:pan-y; cursor:crosshair; }
  .jdot{ position:absolute; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; padding:0; border-radius:50%; background:var(--surface); border:2px solid var(--ink-faint); cursor:pointer; z-index:2; transition:transform .12s; }
  .jdot:hover,.jdot.hot,.jdot:focus-visible{ transform:scale(1.5); }
  .jcross{ position:absolute; top:0; bottom:0; width:0; border-left:1px solid var(--accent); pointer-events:none; z-index:1; }
  .jtip{ position:absolute; z-index:5; min-width:170px; max-width:230px; padding:10px 12px; border-radius:var(--r-md); background:var(--ink); color:var(--bg); box-shadow:var(--shadow-lg); pointer-events:none; display:flex; flex-direction:column; gap:3px; font-size:12px; }
  .jtip[hidden]{ display:none; }
  .jtip b{ font-size:12.5px; line-height:1.3; } .jtip span{ opacity:.85; } .jtip .row i{ font-style:normal; opacity:.65; margin-right:4px; }
  .seg-bar i[data-act]{ cursor:pointer; } .seg-bar i[data-act]:hover{ filter:brightness(.9); }
  .cf-list{ display:flex; flex-direction:column; margin-top:14px; border-top:1px solid var(--border); }
  .cf-item{ display:flex; align-items:center; gap:12px; padding:11px 4px; background:none; border:none; border-bottom:1px solid var(--border); text-align:left; cursor:pointer; width:100%; }
  .cf-item:last-child{ border-bottom:none; } .cf-item:hover{ background:var(--surface-2); }
  .cf-item .d{ width:52px; font-size:12px; font-weight:700; color:var(--ink-dim); flex:none; }
  .cf-item .t{ flex:1; min-width:0; display:flex; flex-direction:column; } .cf-item .t b{ font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .cf-item .t span{ font-size:12px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cf-item .a{ font-weight:700; font-size:13px; white-space:nowrap; }
  .cf-empty{ margin-top:14px; padding-top:14px; border-top:1px solid var(--border); font-size:13px; color:var(--ink-dim); }
  .jdot.paid{ background:var(--accent); border-color:var(--accent); }
  .jdot.overdue{ background:var(--bad); border-color:var(--bad); }
  .jaxis{ display:flex; justify-content:space-between; margin:10px 0 0 34px; font-size:11px; color:var(--ink-faint); font-weight:600; }
  .jkey{ display:flex; gap:16px; flex-wrap:wrap; margin:14px 0 0 34px; font-size:12px; color:var(--ink-dim); }
  .jkey i{ display:inline-block; width:16px; height:0; border-top:2.5px solid var(--accent); vertical-align:middle; margin-right:6px; }
  .jkey i.dash{ border-top:2px dashed var(--ink-faint); }

  /* resale gauge */
  .gauge{ position:relative; padding:0 20px; margin-top:30px; }
  .gauge-track{ position:relative; height:12px; border-radius:99px; background:var(--surface-3); }
  .gauge-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:var(--accent); }
  .gauge-mark{ position:absolute; top:-6px; bottom:-6px; width:2px; background:var(--ink); border-radius:2px; }
  .gauge-mark span{ position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:10.5px; font-weight:700; white-space:nowrap; }
  .gauge-scale{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint); font-weight:600; margin-top:8px; }

  /* key dates */
  .kd{ padding:8px 20px 20px; }
  .kd-item{ position:relative; display:flex; gap:14px; padding-bottom:18px; }
  .kd-item:last-child{ padding-bottom:0; }
  .kd-item::before{ content:""; position:absolute; left:6px; top:16px; bottom:-2px; width:2px; background:var(--border); }
  .kd-item:last-child::before{ display:none; }
  .kd-dot{ width:14px; height:14px; border-radius:50%; border:2px solid var(--border-strong); background:var(--surface); flex:none; margin-top:2px; z-index:1; }
  .kd-item.done .kd-dot{ background:var(--good); border-color:var(--good); }
  .kd-item.now .kd-dot{ background:var(--ink); border-color:var(--ink); }
  .kd-item.warn .kd-dot{ background:var(--warn); border-color:var(--warn); }
  .kd-item.bad .kd-dot{ background:var(--bad); border-color:var(--bad); }
  .kd-item .t{ font-size:13.5px; font-weight:600; }
  .kd-item .s{ font-size:12.5px; color:var(--ink-dim); margin-top:1px; }
  .kd-item.faint .t{ color:var(--ink-dim); font-weight:500; }

  /* grouped schedule */
  .grp{ margin-bottom:14px; overflow:clip; }
  .grp > summary{ list-style:none; display:flex; align-items:center; gap:10px; padding:14px 20px; cursor:pointer; background:var(--surface); }
  .grp > summary::-webkit-details-marker{ display:none; }
  .grp .g-dot{ width:9px; height:9px; border-radius:50%; background:var(--ink-faint); }
  .grp.overdue .g-dot{ background:var(--bad); } .grp.soon .g-dot{ background:var(--warn); } .grp.paid .g-dot{ background:var(--good); } .grp.upcoming .g-dot{ background:var(--info); }
  .grp .g-t{ font-weight:700; font-size:14px; }
  .grp .g-n{ color:var(--ink-faint); font-size:12.5px; }
  .grp .g-sum{ margin-left:auto; font-weight:700; font-size:13.5px; }
  .grp .g-chev{ color:var(--ink-faint); transition:transform .2s; }
  .grp[open] .g-chev{ transform:rotate(180deg); }
  .mrow{ border-top:1px solid var(--border); }
  .mrow > summary{ list-style:none; cursor:pointer; padding:14px 20px; display:flex; gap:14px; align-items:center; }
  .mrow > summary::-webkit-details-marker{ display:none; }
  .mrow > summary:hover{ background:var(--surface-2); }
  .mrow .dbox{ width:48px; flex:none; text-align:center; line-height:1; }
  .mrow .dbox b{ display:block; font-size:18px; font-weight:700; }
  .mrow .dbox span{ display:block; font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-faint); font-weight:700; margin-top:4px; }
  .mrow .dbox.tbc b{ color:var(--ink-faint); }
  .mrow .m-main{ flex:1; min-width:0; }
  .mrow .m-t{ font-size:14px; font-weight:600; line-height:1.3; }
  .mrow .m-s{ font-size:12px; color:var(--ink-dim); margin-top:3px; display:flex; flex-wrap:wrap; gap:2px 12px; }
  .mrow .m-a{ text-align:right; flex:none; }
  .mrow .m-a b{ display:block; font-size:14px; font-weight:700; }
  .mrow .m-a span{ font-size:11.5px; color:var(--ink-faint); }
  .mrow.next > summary{ background:var(--accent-soft); }
  .mrow.paid .m-t{ color:var(--ink-dim); }
  .m-more{ padding:4px 20px 18px 82px; display:grid; grid-template-columns:1fr 1fr; gap:12px 18px; }
  .m-more .k{ font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-faint); font-weight:700; }
  .m-more .v{ font-size:13px; font-weight:600; margin-top:2px; word-break:break-word; }
  .m-more .full{ grid-column:1/-1; }
  .m-more .acts{ grid-column:1/-1; display:flex; gap:8px; }
  .miniseg{ display:inline-flex; height:4px; width:48px; border-radius:4px; background:var(--surface-3); overflow:hidden; vertical-align:middle; margin-right:6px; }
  .miniseg i{ display:block; background:var(--accent); }

  /* sheet table */
  .sheet-wrap{ overflow:auto; -webkit-overflow-scrolling:touch; border-radius:var(--r-lg); border:1px solid var(--border); box-shadow:var(--shadow); background:var(--surface); max-height:70vh; }
  table.sheet{ border-collapse:separate; border-spacing:0; width:100%; font-size:13px; }
  table.sheet.wide{ min-width:980px; }
  table.sheet th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; color:var(--ink-faint); background:var(--surface-2);
    padding:11px 14px; white-space:nowrap; position:sticky; top:0; z-index:2; border-bottom:1px solid var(--border);
  }
  table.sheet td{ padding:12px 14px; border-top:1px solid var(--border); white-space:nowrap; }
  table.sheet tbody tr:first-child td{ border-top:none; }
  table.sheet td.wrap{ white-space:normal; min-width:170px; }
  table.sheet tbody tr:hover td{ background:var(--surface-2); }
  table.sheet .num, table.sheet th.num{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-variant-numeric:tabular-nums; text-align:right; }
  table.sheet th.num{ font-family:'Inter',sans-serif; }
  table.sheet tr.clickable{ cursor:pointer; }
  .st{ font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.3px; display:inline-flex; align-items:center; gap:6px; }
  .st::before{ content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .st.paid{ color:var(--good); } .st.overdue{ color:var(--bad); } .st.soon{ color:var(--warn); }
  .st.upcoming, .st.undecided{ color:var(--ink-faint); }
  table.sheet tfoot td{ border-top:2px solid var(--border); font-weight:700; background:var(--surface-2); position:sticky; bottom:0; z-index:2; }
  .sheet-hint{ font-size:12px; color:var(--ink-faint); margin:9px 4px 0; }

  /* =====================================================================
     PAYMENTS
     ===================================================================== */
  .statgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:16px; }
  .stat{
    text-align:left; padding:14px 15px; border-radius:var(--r-lg); border:1px solid var(--border); background:var(--surface); cursor:pointer; font:inherit; color:inherit;
    position:relative; transition:transform .15s var(--ease), border-color .15s, box-shadow .15s; box-shadow:var(--shadow-sm);
  }
  .stat:hover{ transform:translateY(-2px); border-color:var(--border-strong); }
  .stat .top{ display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--ink-dim); }
  .stat .top i{ width:8px; height:8px; border-radius:50%; background:var(--ink-faint); }
  .stat.t-overdue .top i{ background:var(--bad); } .stat.t-soon .top i{ background:var(--warn); }
  .stat.t-upcoming .top i{ background:var(--info); } .stat.t-paid .top i{ background:var(--good); }
  .stat .amt{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:20px; font-weight:600; margin-top:9px; line-height:1.1; }
  .stat .cnt{ font-size:12px; color:var(--ink-faint); margin-top:4px; }
  .stat.active{ border-color:var(--ink); box-shadow:0 0 0 1px var(--ink), var(--shadow); }
  .stat:last-child:nth-child(odd){ grid-column:1/-1; }
  .month-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:11px 20px; background:var(--surface-2); border-top:1px solid var(--border); font-size:12px; font-weight:700; color:var(--ink-dim); position:sticky; top:60px; z-index:3; }
  .month-head:first-child{ border-top:none; border-radius:var(--r-lg) var(--r-lg) 0 0; }
  .month-head .sum{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-weight:600; }
  .list-card{ overflow:clip; }
  .range-inputs{ display:flex; gap:8px; flex-wrap:wrap; }
  .range-inputs label{ display:flex; flex-direction:column; gap:4px; font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.5px; }
  .range-inputs .input{ min-height:44px; padding:8px 12px; font-size:13.5px; width:auto; }
  .results-meta .rl{ color:var(--ink-faint); }
  .results-meta{ font-size:12.5px; color:var(--ink-dim); margin:0 4px 10px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }

  /* =====================================================================
     ACCOUNT
     ===================================================================== */
  .g-account{ display:grid; gap:14px; grid-template-columns:1fr; }
  .profile{ display:flex; align-items:center; gap:18px; padding:22px; }
  .profile h2{ font-size:22px; }
  .profile p{ color:var(--ink-dim); font-size:13.5px; margin-top:3px; word-break:break-all; }
  .pref{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 20px; border-top:1px solid var(--border); }
  .pref:first-of-type{ border-top:none; }
  .pref .t b{ display:block; font-size:14px; }
  .pref .t span{ font-size:12.5px; color:var(--ink-dim); }
  .switch{ position:relative; width:46px; height:28px; border-radius:99px; border:none; background:var(--surface-3); cursor:pointer; flex:none; transition:background .2s; }
  .switch::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .25s var(--ease); }
  .switch[aria-checked="true"]{ background:var(--accent); }
  .switch[aria-checked="true"]::after{ transform:translateX(18px); }
  .access-row{ display:flex; align-items:center; gap:12px; padding:13px 20px; border-top:1px solid var(--border); width:100%; background:none; border-left:none; border-right:none; border-bottom:none; text-align:left; }
  button.access-row{ cursor:pointer; } button.access-row:hover{ background:var(--surface-2); }
  .access-row:first-child{ border-top:none; }
  .access-row .nm{ flex:1; font-weight:600; font-size:14px; }
  .shortcuts{ padding:6px 20px 16px; }
  .sc{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-top:1px solid var(--border); font-size:13px; color:var(--ink-dim); }
  .sc:first-child{ border-top:none; }
  .sc .kbd{ margin-left:0; }
  .about{ text-align:center; font-size:12px; color:var(--ink-faint); padding:8px 0 4px; }

  /* =====================================================================
     COMMAND PALETTE + TOASTS
     ===================================================================== */
  .palette-back{ position:fixed; inset:0; z-index:100; background:rgba(6,12,11,.5); backdrop-filter:blur(4px); display:flex; align-items:flex-start; justify-content:center; padding:12vh 16px 16px; animation:fade .15s both; }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }
  .palette{ width:100%; max-width:560px; background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r-xl); box-shadow:var(--shadow-lg); overflow:hidden; animation:pop .2s var(--ease) both; }
  @keyframes pop{ from{ opacity:0; transform:translateY(-8px) scale(.98); } to{ opacity:1; transform:none; } }
  .palette-input{ display:flex; align-items:center; gap:12px; padding:0 18px; border-bottom:1px solid var(--border); color:var(--ink-faint); }
  .palette-input input{ flex:1; border:none; background:none; outline:none; font-size:16px; color:var(--ink); padding:18px 0; min-width:0; }
  .palette-list{ max-height:min(56vh,420px); overflow-y:auto; padding:8px; }
  .pl-group{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--ink-faint); padding:10px 12px 6px; }
  .pl-item{ display:flex; align-items:center; gap:12px; padding:0 12px; min-height:46px; border-radius:var(--r-md); cursor:pointer; font-size:14px; width:100%; border:none; background:none; text-align:left; }
  .pl-item .pi{ width:30px; height:30px; border-radius:9px; background:var(--surface-2); color:var(--ink-dim); display:flex; align-items:center; justify-content:center; flex:none; }
  .pl-item .sub{ margin-left:auto; font-size:12px; color:var(--ink-faint); white-space:nowrap; }
  .pl-item.sel{ background:var(--accent-soft); }
  .pl-item.sel .pi{ background:var(--accent); color:var(--accent-ink); }
  .pl-empty{ padding:30px; text-align:center; color:var(--ink-faint); font-size:13.5px; }
  .palette-foot{ display:flex; gap:16px; padding:10px 18px; border-top:1px solid var(--border); font-size:11.5px; color:var(--ink-faint); }
  .palette-foot .kbd{ margin:0 5px 0 0; }
  #toasts{ position:fixed; left:0; right:0; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:120; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding:0 16px; }
  .toast{ background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:99px; font-size:13px; font-weight:600; box-shadow:var(--shadow-lg); animation:toast-in .3s var(--ease) both; display:flex; align-items:center; gap:9px; max-width:100%; }
  .toast.out{ animation:toast-out .25s ease both; }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(12px) scale(.96); } to{ opacity:1; transform:none; } }
  @keyframes toast-out{ to{ opacity:0; transform:translateY(8px); } }

  /* =====================================================================
     SKELETON / STATES
     ===================================================================== */
  .skel{ position:relative; overflow:hidden; background:var(--surface-3); border-radius:10px; }
  .skel::after{ content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 65%, transparent), transparent); animation:shimmer 1.4s infinite; }
  @keyframes shimmer{ to{ transform:translateX(100%); } }
  .load-error{ max-width:460px; margin:12vh auto; text-align:center; padding:30px; }
  .masked{ letter-spacing:1px; }

  /* =====================================================================
     RESPONSIVE
     ===================================================================== */
  @media (min-width:560px){
    .statgrid{ grid-template-columns:repeat(3,minmax(0,1fr)); }
    .stat:last-child:nth-child(odd){ grid-column:auto; }

  /* ---------------- domain logic ---------------- */
  function milestoneState(m){
    if(m.status === 'Paid') return 'paid';
    if(!m.due_date) return 'undecided';
    var d = daysUntil(m.due_date);
    if(d < 0) return 'overdue';
    if(d <= 30) return 'soon';
    return 'upcoming';
  }
  var STATE_LABEL = { paid:'Paid', overdue:'Overdue', soon:'Due soon', upcoming:'Upcoming', undecided:'Date TBC' };
  var STATE_PILL = { paid:'good', overdue:'bad', soon:'warn', upcoming:'', undecided:'' };
  function mAmt(m){ return Number(m.amount_aed || 0); }
  function propOf(id){ return state.properties.find(function(p){ return p.id === id; }); }
  function byDue(a, b){ return new Date(a.due_date || '2099-01-01') - new Date(b.due_date || '2099-01-01'); }
  function paidPct(p){ return Number(p.total_unit_price_aed) > 0 ? Number(p.total_paid_aed||0) / Number(p.total_unit_price_aed) : 0; }

  function resaleEligibility(p){
    var applicable = String(p.resale_applicable||'').toUpperCase() === 'YES';
    if(!applicable) return { applicable:false, eligible:false, unknown: !String(p.resale_applicable||'').trim() };
    var req = Number(p.resale_noc_pct||0), pd = paidPct(p);
    return { applicable:true, eligible: pd >= req, reqPct:req, paidPct:pd };
  }

  function nextMilestone(pid){
    var list = state.milestones.filter(function(m){ return m.property_id === pid && m.status !== 'Paid' && m.due_date; }).sort(byDue);
    return list[0] || null;
  }

  function portfolioTotals(){
    var v=0, pd=0, pe=0;
    state.properties.forEach(function(p){ v += Number(p.total_unit_price_aed||0); pd += Number(p.total_paid_aed||0); pe += Number(p.total_pending_aed||0); });
    return { value:v, paid:pd, pending:pe, pct: v > 0 ? pd / v : 0 };
  }

  function bucketMilestones(list){
    var b = { overdue:[], soon:[], upcoming:[], undecided:[], paid:[] };
    list.forEach(function(m){ b[milestoneState(m)].push(m); });
    return b;
  }
  function sumAmt(list){ return list.reduce(function(a, m){ return a + mAmt(m); }, 0); }

  function cashflow(){
    var months = [], i;
    for(i = 0; i < 12; i++){
      var d = new Date(TODAY.getFullYear(), TODAY.getMonth() + i, 1);
      months.push({ key: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'), label: d.toLocaleDateString('en-US', { month:'short' }), full: d.toLocaleDateString('en-GB', { month:'long', year:'numeric' }), amt:0, n:0, kind:'m', items:[] });
    }
    var od = { key:'od', label:'Late', full:'Overdue', amt:0, n:0, kind:'od', items:[] };
    var later = { key:'later', label:'Later', full:'Beyond 12 months', amt:0, n:0, kind:'later', items:[] };
    state.milestones.forEach(function(m){
      if(m.status === 'Paid' || !m.due_date) return;
      var st = milestoneState(m);
      if(st === 'overdue'){ od.amt += mAmt(m); od.n++; od.items.push(m); return; }
      var slot = months.find(function(x){ return x.key === m.due_date.slice(0,7); });
      if(slot){ slot.amt += mAmt(m); slot.n++; slot.items.push(m); } else { later.amt += mAmt(m); later.n++; later.items.push(m); }
    });
    var cols = months.slice();
    if(od.n) cols.unshift(od);
    if(later.n) cols.push(later);
    return cols;
  }

  /* ---------------- data ---------------- */
  async function init(){
    renderSkeleton();
    if(!sb){ renderFatal('We could not reach the portfolio service. Check your connection and try again.'); return; }
    try {
      var res = await sb.auth.getSession();
      var session = res.data ? res.data.session : null;
      if(session){ state.session = session; await loadEverything(); }
      else { renderLogin(); }
    } catch(e){ renderFatal('Something went wrong while starting up.'); }
  }

  async function loadEverything(){
    renderSkeleton();
    try {
      var userId = state.session.user.id;
      var profRes = await sb.from('profiles').select('*').eq('id', userId).single();
      if(profRes.error || !profRes.data){ renderLogin('Could not load your profile. Please try again.'); return; }
      state.profile = profRes.data;

      var portRes = await sb.from('portfolios').select('*').order('name');
      state.portfolios = portRes.data || [];
      if(!state.currentPortfolioId && state.portfolios.length) state.currentPortfolioId = state.portfolios[0].id;

      var fxRes = await sb.from('fx_rates').select('*').eq('id', 1).single();
      if(fxRes.data) state.fxRate = fxRes.data.aed_to_inr;
      loadRates().then(function(){ if(state.profile && (state.currency !== 'AED' || state.route.tab === 'account')) render(); });

      await loadPortfolioData();
      state.route = parseHash();
      state.animate = true;
      state.updatedAt = Date.now();
      render();
    } catch(e){
      state.loadError = 'We could not load your portfolio.';
      renderFatal(state.loadError, true);
    }
  }

  async function loadPortfolioData(){
    state.loadError = '';
    if(!state.currentPortfolioId){ state.properties = []; state.milestones = []; return; }
    var propRes = await sb.from('properties').select('*').eq('portfolio_id', state.currentPortfolioId).order('purchase_date');
    if(propRes.error){ throw propRes.error; }
    state.properties = propRes.data || [];
    var ids = state.properties.map(function(p){ return p.id; });
    if(ids.length){
      var msRes = await sb.from('payment_milestones').select('*').in('property_id', ids).order('due_date');
      if(msRes.error){ throw msRes.error; }
      state.milestones = msRes.data || [];
    } else { state.milestones = []; }
  }

  async function doLogin(email, password, btn){
    btn.disabled = true; btn.innerHTML = 'Signing in…';
    var res;
    try { res = await sb.auth.signInWithPassword({ email:email, password:password }); }
    catch(e){ res = { error:{ message:'Network error. Please try again.' } }; }
    if(res.error){
      btn.disabled = false; btn.innerHTML = 'Log in ' + icon('arrowRight','',16,2);
      showLoginError(res.error.message === 'Invalid login credentials' ? 'Incorrect email or password.' : res.error.message);
      return;
    }
    state.session = res.data.session;
    await loadEverything();
  }

    state = freshState(); state.currency = keep.currency; state.privacy = keep.privacy; state.theme = keep.theme; state.secondary = keep.secondary; state.rates = keep.rates; state.ratesMeta = keep.ratesMeta;

  /* ---------------- routing ---------------- */
  function parseHash(){
    var parts = (location.hash || '').replace(/^#\/?/, '').split('/');
    if(parts[0] === 'properties' && parts[1]) return { tab:'detail', id:decodeURIComponent(parts[1]) };
    if(parts[0] === 'properties' || parts[0] === 'payments' || parts[0] === 'account') return { tab:parts[0] };
    return { tab:'dashboard' };
  }
  function go(path){
    var target = '#/' + path;
    if(location.hash === target){ state.route = parseHash(); render(); return; }
    location.hash = target;
  }
  window.addEventListener('hashchange', function(){
    if(!state.profile) return;
    var prev = state.route; state.route = parseHash();
    if(prev.tab !== state.route.tab || prev.id !== state.route.id){
      if(state.route.tab === 'detail'){ state.propTab = 'overview'; state.tlView = 'timeline'; }
      state.animate = true; render(); window.scrollTo(0, 0);
    }
  });

  /* after every render: kick off ring/bar/count animations */
  function postRender(){
    fitAll();
    if(REDUCED) return;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      app.querySelectorAll('.ring .prog[data-off]').forEach(function(c){ c.style.strokeDashoffset = c.getAttribute('data-off'); });
      app.querySelectorAll('.bar > i[data-w]').forEach(function(b){ b.style.width = b.getAttribute('data-w'); });
    }); });
    app.querySelectorAll('[data-count]').forEach(function(el){
      if(!el.hasAttribute('data-anim')) return;
      var target = Number(el.getAttribute('data-count')), t0 = null, dur = 900;
      function tick(ts){
        if(t0 === null) t0 = ts;
        var k = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        el.textContent = fmtMoney(target * e);
        if(k < 1) requestAnimationFrame(tick); else { el.textContent = fmtMoney(target); fitText(el); }
      }
      if(!state.privacy) requestAnimationFrame(tick);
    });
  }
  /* shrink long figures to fit their box (any currency, any magnitude) instead of wrapping or clipping */
  function fitText(el){
    el.style.fontSize = '';
    var fs = parseFloat(getComputedStyle(el).fontSize);
    while(el.scrollWidth > el.clientWidth + 0.5 && fs > 12){ fs -= 1; el.style.fontSize = fs + 'px'; }
  }
  function fitAll(){ app.querySelectorAll('.hero-value,.dsum-paid,.nextup .amt,.next-amt,.dstat .v,.kpi-value,.stat .amt,.hero-stat .v').forEach(fitText); }
  var fitT = null; window.addEventListener('resize', function(){ clearTimeout(fitT); fitT = setTimeout(fitAll, 120); });
  function barFill(pct, extraCls){
    var w = Math.round(Math.min(1, Math.max(0, pct)) * 100) + '%';
    var start = (REDUCED || !state.animate) ? w : '0%';
    return '<div class="bar '+(extraCls||'')+'" role="progressbar" aria-valuenow="'+parseInt(w,10)+'" aria-valuemin="0" aria-valuemax="100"><i data-w="'+w+'" style="width:'+start+'"></i></div>';
  }

  /* ---------------- DASHBOARD ---------------- */
  function renderDashboard(){
    var t = portfolioTotals(), b = bucketMilestones(state.milestones);
    var portfolio = state.portfolios.find(function(p){ return p.id === state.currentPortfolioId; });

    if(!state.properties.length){
      return '<div class="page-head"><div><h1>'+greeting()+', '+esc(firstName(state.profile.full_name))+'</h1><p>'+esc(portfolio ? portfolio.name : 'Your portfolio')+'</p></div></div>' +

    }

    var due90 = state.milestones.filter(function(m){ var d = daysUntil(m.due_date); return m.status !== 'Paid' && d !== null && d >= 0 && d <= 90; });

        '<div class="hero-top"><div style="min-width:0">' +
          '<div class="hero-label">Total portfolio value</div>' +
          '<div class="hero-value'+fitCls(fmtMoney(t.value))+'" data-count="'+t.value+'"'+(state.animate?' data-anim':'')+'>'+fmtMoney(t.value)+'</div>' +

          '<div class="hero-stat"><div class="k">Paid to date</div><div class="v">'+fmtCompact(t.paid)+'</div></div>' +
          '<div class="hero-stat"><div class="k">Remaining</div><div class="v">'+fmtCompact(t.pending)+'</div></div>' +
          '<div class="hero-stat"><div class="k">Next 90 days</div><div class="v">'+fmtCompact(sumAmt(due90))+'</div></div>' +
        '</div>' +
      '</section>';

    /* next payment */
    var nextCard;

      var nd = daysUntil(nextPay.due_date), np = propOf(nextPay.property_id), ns = milestoneState(nextPay);

        '<section class="card next-card '+(ns==='overdue'?'overdue':ns==='soon'?'soon':'')+'" aria-label="Next payment">' +
          '<div class="next-eyebrow">'+icon('clock','',14,2)+' Next payment</div>' +
          '<div class="next-days"><b>'+big+'</b><span>'+unit+'</span></div>' +
          '<div class="next-amt'+fitCls(fmtMoney(mAmt(nextPay)))+'">'+fmtMoney(mAmt(nextPay))+'</div>' +
          '<div class="next-what"><b>'+esc(np ? np.project_name : '')+'</b><br>'+esc(nextPay.milestone_event)+' · '+fmtDate(nextPay.due_date)+'</div>' +
          '<div class="next-foot desk-only" style="gap:8px;flex-wrap:wrap"><button class="btn btn-sm" data-act="ics-ms" data-id="'+esc(nextPay.id)+'">'+icon('calendar','',14)+' Remind me</button><button class="btn btn-ghost btn-sm" data-act="open-prop" data-id="'+esc(nextPay.property_id)+'" data-goto-sched="1">Schedule '+icon('arrowRight','',14,2)+'</button></div>' +
        '</section>';
    } else {

        '<div class="all-clear" style="margin:auto"><div class="ok">'+icon('check','',22,2.4)+'</div>Nothing scheduled.<br>Every dated milestone is settled.</div></section>';

    /* KPIs */
    var od = b.overdue;
    var kpis =
      '<div class="grid g-kpi">' +
        '<div class="card kpi"><div class="kpi-top"><span class="kpi-label">Paid to date</span><span class="kpi-ico good">'+icon('check','',16,2.2)+'</span></div><div class="kpi-value">'+fmtCompact(t.paid)+'</div><div class="kpi-sub">'+fmtPct(t.pct)+' of total value</div></div>' +
        '<div class="card kpi"><div class="kpi-top"><span class="kpi-label">Remaining</span><span class="kpi-ico accent">'+icon('wallet','',16)+'</span></div><div class="kpi-value">'+fmtCompact(t.pending)+'</div><div class="kpi-sub">'+((b.overdue.length + b.soon.length + b.upcoming.length + b.undecided.length) ? 'across '+plural(b.overdue.length + b.soon.length + b.upcoming.length + b.undecided.length,'milestone') : 'no payment schedule added yet')+'</div></div>' +
        '<button class="card kpi'+(od.length?' alert':'')+'" data-act="pay-tab" data-tab="'+(od.length?'overdue':'soon')+'"><div class="kpi-top"><span class="kpi-label">'+(od.length?'Overdue':'Due in 30 days')+'</span><span class="kpi-ico '+(od.length?'bad':'warn')+'">'+icon(od.length?'alert':'clock','',16)+'</span></div>' +
          '<div class="kpi-value">'+fmtCompact(sumAmt(od.length ? od : b.soon))+'</div><div class="kpi-sub">'+plural((od.length ? od : b.soon).length,'payment')+'</div></button>' +

      '</div>';

    /* cash-flow */
    var cols = cashflow(), maxAmt = Math.max.apply(null, cols.map(function(c){ return c.amt; }).concat([1]));
    var total12 = cols.reduce(function(a,c){ return a + (c.kind === 'm' ? c.amt : 0); }, 0);
    var cfHtml = cols.map(function(c, i){
      var h = c.amt > 0 ? Math.max(4, Math.round(c.amt / maxAmt * 100)) : 2;
      return '<button class="cf-col'+(c.amt?'':' empty')+(c.kind==='od'?' od':'')+(c.kind==='later'?' later':'')+(state.cfSel===i?' sel':'')+'" data-act="cf" data-i="'+i+'" aria-label="'+esc(c.full)+': '+esc(fmtMoney(c.amt))+', '+plural(c.n,'payment')+'">' +
        '<span class="plot"><span class="b" style="height:'+(state.animate && !REDUCED ? 2 : h)+'%" data-h="'+h+'"></span></span><span class="l">'+esc(c.label)+'</span></button>';
    }).join('');
    var sel = state.cfSel != null ? cols[state.cfSel] : null;
    var readout = sel
      ? '<div class="big" id="cfBig">'+fmtMoney(sel.amt)+'</div><div class="lbl" id="cfLbl">'+esc(sel.full)+' · '+plural(sel.n,'payment')+'</div>'
      : '<div class="big" id="cfBig">'+fmtMoney(total12)+'</div><div class="lbl" id="cfLbl">due over the next 12 months</div>';
    var cashCard =
      '<section class="card desk-only" aria-label="Payment forecast">' +
        '<div class="card-head"><div><div class="card-title">Payment forecast</div><div class="card-sub">What is due, month by month. Hover or tap a bar; select one to list its payments.</div></div></div>' +
        '<div class="cf"><div class="cf-readout">'+readout+'</div>' +
          '<div class="cf-scroll"><div class="cf-chart" id="cfChart">'+cfHtml+'</div></div>' +
          '<div id="cfDetail">'+(sel ? cfDetail(sel) : '')+'</div></div>' +
      '</section>';

    /* attention */
    var items = [];
    if(b.overdue.length) items.push({ tone:'bad', ico:'alert', t: plural(b.overdue.length,'overdue payment'), s: fmtMoney(sumAmt(b.overdue)) + ' needs attention now', act:'pay-tab', data:'overdue' });
    if(b.soon.length) items.push({ tone:'warn', ico:'clock', t: plural(b.soon.length,'payment') + ' due within 30 days', s: fmtMoney(sumAmt(b.soon)) + ' total', act:'pay-tab', data:'soon' });

    if(resaleReady.length) items.push({ tone:'good', ico:'resale', t: plural(resaleReady.length,'unit') + ' resale-ready', s: resaleReady.slice(0,2).map(function(p){ return p.project_name; }).join(', ') + (resaleReady.length > 2 ? ' +' + (resaleReady.length-2) : ''), act:'prop-filter-go', data:'resale' });
    if(handovers.length) items.push({ tone:'info', ico:'developer', t:'Next handover: ' + handovers[0].project_name, s: fmtDate(handovers[0].handover_date) + ' · ' + relMonths(handovers[0].handover_date), act:'open-prop', data:handovers[0].id });
    var attHtml = items.length ? '<div class="att-list">' + items.map(function(i){
      return '<button class="att" data-act="'+i.act+'" data-tab="'+esc(i.data)+'" data-v="'+esc(i.data)+'" data-id="'+esc(i.data)+'"><span class="att-ico '+i.tone+'">'+icon(i.ico,'',18)+'</span><span><b>'+esc(i.t)+'</b><span class="s">'+esc(i.s)+'</span></span><span class="chev">'+icon('chevronRight','',16)+'</span></button>';
    }).join('') + '</div>'
      : '<div class="all-clear"><div class="ok">'+icon('check','',22,2.4)+'</div>You are all caught up.</div>';
    var attCard = sect('Needs attention', '<section class="card" aria-label="Needs attention">'+attHtml+'</section>');

    /* allocation */
    var maxVal = Math.max.apply(null, state.properties.map(function(p){ return Number(p.total_unit_price_aed||0); }).concat([1]));
    var allocRows = state.properties.map(function(p){
      var paid = Number(p.total_paid_aed||0), pend = Number(p.total_pending_aed||0);
      return '<button class="alloc-row" data-act="open-prop" data-id="'+esc(p.id)+'"><div class="alloc-top"><span class="nm">'+esc(p.project_name)+'</span><span class="vl">'+fmtCompact(paid+pend)+' · '+Math.round(paidPct(p)*100)+'%</span></div>' +
        '<div style="display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);width:'+Math.max(8, Math.round((paid+pend)/maxVal*100))+'%">' +
        '<div style="width:'+(paid+pend > 0 ? paid/(paid+pend)*100 : 0)+'%;background:var(--accent)"></div><div style="flex:1;background:var(--surface-3)"></div></div></button>';

    var allocCard = sect('By property', '<section class="card" aria-label="By property"><div class="alloc">' + allocRows + '</div></section>');

    var upcoming = state.milestones.filter(function(m){ return m.status !== 'Paid'; }).sort(byDue).slice(0, 5);
    var upHtml = upcoming.length ? upcoming.map(function(m){ return paymentRow(m, false); }).join('')

    return (
      '<div class="page-head"><div><h1>'+greeting()+', '+esc(firstName(state.profile.full_name))+'</h1><p>'+(portfolio ? esc(portfolio.name)+' · ' : '')+'here is where your portfolio stands today.</p></div></div>' +
      '<div class="grid g-hero">' + hero + nextCard + '</div>' +
      kpis +
      '<div class="grid g-two">' + cashCard + attCard + '</div>' +
      '<div class="grid g-two even">' + allocCard + upCard + '</div>'

  /* small uppercase label above a card — the native app's section header */
  function sect(title, inner){ return '<div class="sect"><div class="sect-label">'+esc(title)+'</div>'+inner+'</div>'; }

  function cfDetail(c){
    if(!c || !c.items.length) return '<div class="cf-empty">Nothing due in ' + esc(c ? c.full : '') + '.</div>';
    return '<div class="cf-list">' + c.items.slice().sort(byDue).map(function(m){
      var p = propOf(m.property_id);
      return '<button class="cf-item" data-act="open-prop" data-id="'+esc(m.property_id)+'" data-goto-sched="1"><span class="d">'+fmtDateShort(m.due_date)+'</span><span class="t"><b>'+esc(p ? p.project_name : '')+'</b><span>'+esc(m.milestone_event)+'</span></span><span class="a">'+fmtMoney(mAmt(m))+'</span></button>';
    }).join('') + '</div>';

  function cfShow(i){
    var cols = cashflow(), c = i != null ? cols[i] : null, big = document.getElementById('cfBig'), lbl = document.getElementById('cfLbl');
    if(!big) return;
    var total12 = cols.reduce(function(a,x){ return a + (x.kind === 'm' ? x.amt : 0); }, 0);
    big.textContent = fmtMoney(c ? c.amt : total12);
    lbl.textContent = c ? c.full + ' · ' + plural(c.n,'payment') : 'due over the next 12 months';
  }

  /* one payment row (used on dashboard + payments list) */
  function paymentRow(m, showDate){
    var p = propOf(m.property_id), st = milestoneState(m), d = daysUntil(m.due_date);
    var big, sub, cls = st === 'overdue' ? 'overdue' : st === 'soon' ? 'soon' : st === 'paid' ? 'paid' : '';
    if(st === 'paid'){ big = icon('check','',18,2.6); sub = 'PAID'; }
    else if(st === 'undecided'){ big = '—'; sub = 'TBC'; }
    else { big = Math.abs(d); sub = d < 0 ? 'LATE' : d === 0 ? 'TODAY' : d === 1 ? 'DAY' : 'DAYS'; }
    return '<button class="prow" data-act="open-prop" data-id="'+esc(m.property_id)+'" data-goto-sched="1">' +
      '<div class="datebox '+cls+'"><b>'+big+'</b><span>'+sub+'</span></div>' +
      '<div class="prow-info"><div class="prow-prop">'+esc(p ? p.project_name : '')+'</div><div class="prow-ms">'+icon('calendar','ico-dim',12)+'<span>'+esc(m.milestone_event)+(showDate && m.due_date ? ' · '+fmtDate(m.due_date) : '')+'</span></div></div>' +
      '<div class="prow-amt"><b>'+fmtMoney(mAmt(m))+'</b></div>' +
    '</button>';
  }

  /* ---------------- PROPERTIES ---------------- */
  function filteredProperties(){
    var q = state.propQuery.trim().toLowerCase(), f = state.propFilter;
    var list = state.properties.filter(function(p){
      if(q){
        var hay = [p.project_name, p.developer, p.location, p.unit_type, p.unit_no].join(' ').toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      if(f === 'resale') return resaleEligibility(p).eligible;
      if(f !== 'all') return String(p.status) === f;
      return true;
    });
    var s = state.propSort;
    list.sort(function(a, b){
      if(s === 'value') return Number(b.total_unit_price_aed||0) - Number(a.total_unit_price_aed||0);
      if(s === 'progress') return paidPct(b) - paidPct(a);
      if(s === 'name') return String(a.project_name).localeCompare(String(b.project_name));
      return new Date(a.handover_date || '2099-01-01') - new Date(b.handover_date || '2099-01-01');
    });
    return list;
  }

  function propertyCard(p){
    var pct = paidPct(p), resale = resaleEligibility(p), nm = nextMilestone(p.id), ns = nm ? milestoneState(nm) : null;
    var nextHtml = nm
      ? '<div class="pcard-next '+(ns==='overdue'?'overdue':ns==='soon'?'soon':'')+'"><i></i><div class="t"><b>'+relDays(daysUntil(nm.due_date))+'</b> · '+esc(nm.milestone_event)+'</div><span class="amt">'+fmtCompact(mAmt(nm))+'</span></div>'
      : '<div class="pcard-next done"><i></i><div class="t">'+(Number(p.total_pending_aed) > 0 ? (state.milestones.some(function(m){ return m.property_id === p.id; }) ? 'Remaining milestones have no date yet' : 'Payment schedule not added yet') : 'Fully paid')+'</div></div>';
    return '<button class="card pcard" data-act="open-prop" data-id="'+esc(p.id)+'">' +
      '<div class="pcard-head"><span class="p-ico">'+icon('building','',20)+'</span>' +
        '<div style="min-width:0"><div class="pcard-name">'+esc(p.project_name)+'</div><div class="pcard-sub">'+esc(p.developer||'—')+' · '+esc(p.location||'—')+'</div></div>' +
        '</div>' +
      '<div class="facts">' + (p.status && !/construction/i.test(p.status) ? '<span class="pill">'+esc(p.status)+'</span>' : '') + (resale.eligible ? '<span class="pill good">'+icon('resale','',12,2)+' Resale ready</span>' : '') + '<span><b>'+esc(p.unit_type||'—')+'</b>'+(p.bedrooms?' · '+Math.trunc(p.bedrooms)+' BR':'')+'</span>' +
        '<span>Handover <b>'+(p.handover_date ? fmtDate(p.handover_date) : '—')+'</b></span></div>' +
      '<div class="pcard-prog"><div class="row"><span><b>'+fmtMoney(p.total_paid_aed)+'</b> paid</span><span>'+Math.round(pct*100)+'% of '+fmtCompact(p.total_unit_price_aed)+'</span></div>' + barFill(pct) + '</div>' +
      nextHtml + '</button>';
  }

  function propertyResults(){
    var list = filteredProperties();
    if(!list.length){
      return emptyState('search','No properties match','Try a different search or clear the filters.','<button class="btn btn-ghost btn-sm" data-act="clear-prop-filters">Clear filters</button>');
    }
    return '<div class="prop-grid">' + list.map(propertyCard).join('') + '</div>';

  function renderProperties(){

      (chips ? '<div class="chips" role="group" aria-label="Filter by status">'+chips+'</div>' : '') +

  /* ---------------- PROPERTY DETAIL ---------------- */
  function pad2(n){ return String(n).padStart(2,'0'); }
  function icsEscape(t){ return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
  function downloadIcs(list, filename){
    var items = list.filter(function(m){ return m.due_date && m.status !== 'Paid'; });
    if(!items.length){ toast('No dated payments to add'); return; }
    var stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
    var L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ledger//Portfolio//EN','CALSCALE:GREGORIAN'];
    items.forEach(function(m){
      var p = propOf(m.property_id) || {}, end = new Date(m.due_date + 'T00:00:00'); end.setDate(end.getDate() + 1);
      L.push('BEGIN:VEVENT','UID:'+m.id+'@ledger','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+m.due_date.replace(/-/g,''),
        'DTEND;VALUE=DATE:'+end.getFullYear()+pad2(end.getMonth()+1)+pad2(end.getDate()),
        'SUMMARY:'+icsEscape('Payment due: '+(p.project_name||'')+' - '+m.milestone_event),
        'DESCRIPTION:'+icsEscape('AED '+Math.round(mAmt(m)).toLocaleString('en-US')+' (excl. VAT)'),
        'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Payment due in 3 days','TRIGGER:-P3D','END:VALARM','END:VEVENT');
    });
    L.push('END:VCALENDAR');
    var blob = new Blob([L.join('\r\n')], { type:'text/calendar;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    toast('Calendar file ready · ' + plural(items.length, 'reminder'));
  }

  function shareText(p, ms){
    var nm = nextMilestone(p.id), lines = [
      p.project_name + ' — ' + (p.developer || '') + (p.location ? ' (' + p.location + ')' : ''),
      [p.unit_no ? 'Unit ' + p.unit_no : '', p.unit_type || '', p.bedrooms ? Math.trunc(p.bedrooms) + ' BR' : '', p.size_sqft ? Math.round(p.size_sqft).toLocaleString('en-US') + ' sqft' : ''].filter(Boolean).join(' · '),
      'Price ' + fmtMoney(p.total_unit_price_aed) + ' · Paid ' + Math.round(paidPct(p)*100) + '% (' + fmtMoney(p.total_paid_aed) + ') · Remaining ' + fmtMoney(p.total_pending_aed)
    ];
    if(nm) lines.push('Next payment: ' + nm.milestone_event + ' — ' + fmtDate(nm.due_date) + ' (' + fmtMoney(mAmt(nm)) + ')');
    if(p.handover_date) lines.push('Handover: ' + fmtDate(p.handover_date));
    return lines.filter(Boolean).join('\n');

  async function shareProperty(p){
    var text = shareText(p);
    try {
      if(navigator.share){ await navigator.share({ title:p.project_name, text:text }); return; }
      await navigator.clipboard.writeText(text); toast('Summary copied to clipboard');
    } catch(e){ if(e && e.name !== 'AbortError') toast('Could not share'); }
  }

  function cumulativeShare(ms){
    var total = sumAmt(ms) || 1, acc = 0, out = {};
    ms.slice().sort(function(a,b){ return (a.milestone_no||0) - (b.milestone_no||0); }).forEach(function(m){ acc += mAmt(m); out[m.id] = acc / total; });
    return out;
  }

  function resaleForecast(p, ms, resale){
    if(!resale.applicable) return null;
    if(resale.eligible) return { done:true };
    var need = resale.reqPct * Number(p.total_unit_price_aed||0), acc = Number(p.total_paid_aed||0);
    var list = ms.filter(function(m){ return m.status !== 'Paid' && m.due_date; }).sort(byDue), i;
    for(i = 0; i < list.length; i++){ acc += mAmt(list[i]); if(acc >= need) return { date:list[i].due_date, ms:list[i] }; }
    return { none:true };
  }

  function monthYear(d){ return d.toLocaleDateString('en-US', { month:'short', year:'numeric' }); }

  function journeyChart(p, ms, resale){
    var dated = ms.filter(function(m){ return m.due_date; }).sort(byDue);
    if(dated.length < 2) return '';
    var denom = Math.max(Number(p.total_unit_price_aed||0), sumAmt(ms)) || 1;
    var first = parseDate(dated[0].due_date), last = parseDate(dated[dated.length-1].due_date), ho = parseDate(p.handover_date);
    var t0 = parseDate(p.purchase_date) || first; if(t0 > first) t0 = first;
    var t1 = new Date(Math.max(last.getTime(), ho ? ho.getTime() : 0, TODAY.getTime()));
    var span = (t1 - t0) || 1;
    function X(d){ return Math.min(100, Math.max(0, (d - t0) / span * 100)); }
    function Y(v){ return 100 - Math.min(1, v / denom) * 100; }
    var paid = dated.filter(function(m){ return m.status === 'Paid'; }), open = dated.filter(function(m){ return m.status !== 'Paid'; });
    var cum = 0, act = 'M0,100', dots = '', pts = [];
    function addPt(m, x, y, st){ pts.push({ x:+x.toFixed(2), y:+y.toFixed(2), t:m.milestone_event, d:m.due_date, amt:mAmt(m), cum:Math.round(Math.min(1, cum/denom)*100), cumAmt:cum, st:st }); return pts.length - 1; }
    paid.forEach(function(m){ cum += mAmt(m); var x = X(parseDate(m.due_date)), i = addPt(m, x, Y(cum), 'paid'); act += ' H'+x+' V'+Y(cum); dots += '<button class="jdot paid" data-i="'+i+'" style="left:'+x+'%;top:'+Y(cum)+'%" aria-label="'+esc(m.milestone_event)+', paid"></button>'; });
    var xt = X(TODAY), cumPaid = cum;
    act += ' H' + xt;
    var fill = act + ' V100 Z', proj = 'M' + xt + ',' + Y(cumPaid);
    open.forEach(function(m){
      cum += mAmt(m); var d = parseDate(m.due_date), x = Math.max(X(d), xt), od = d < TODAY, i = addPt(m, x, Y(cum), od ? 'overdue' : 'open');
      proj += ' H'+x+' V'+Y(cum);
      dots += '<button class="jdot'+(od?' overdue':'')+'" data-i="'+i+'" style="left:'+x+'%;top:'+Y(cum)+'%" aria-label="'+esc(m.milestone_event)+(od?', overdue':', scheduled')+'"></button>';
    });
    proj += ' H100';
    var thr = resale && resale.applicable && resale.reqPct ? '<div class="jthr" style="top:'+Y(resale.reqPct * Number(p.total_unit_price_aed||0))+'%"><span>Resale NOC '+Math.round(resale.reqPct*100)+'%</span></div>' : '';
    var hoLine = ho && ho >= t0 && ho <= t1 ? '<div class="jline ho" style="left:'+X(ho)+'%"><span>Handover</span></div>' : '';
    return '<div class="jchart" data-pts="'+esc(JSON.stringify(pts))+'" aria-label="Cumulative payments over time. Hover, tap or use the dots to inspect each milestone.">' +
        [0,50,100].map(function(v){ return '<div class="jgrid" style="top:'+(100-v)+'%"><span>'+v+'%</span></div>'; }).join('') + thr +
        '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="'+fill+'" fill="var(--accent-soft)" stroke="none"/>' +
          '<path d="'+proj+'" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>' +
          '<path d="'+act+'" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>' +
        '<div class="jline today" style="left:'+xt+'%"><span>Today</span></div>' + hoLine + '<div class="jcross" hidden></div>' + dots + '<div class="jtip" hidden></div></div>' +
      '<div class="jaxis"><span>'+monthYear(t0)+'</span><span>'+monthYear(t1)+'</span></div>' +
      '<div class="jkey"><span><i></i>Paid</span><span><i class="dash"></i>Scheduled</span></div>';
  }

  function kvRows(rows){ return '<div class="kv">' + rows.map(function(r){ return '<div class="kv-row'+(r[2]?' total':'')+'"><div class="k">'+r[0]+'</div><div class="v">'+r[1]+'</div></div>'; }).join('') + '</div>'; }

  function renderDetail(){

    var pills = '<span class="pill">'+esc(p.status||'—')+'</span>' + (resale.eligible ? '<span class="pill good">'+icon('resale','',12,2)+' Resale ready</span>' : '') +
      (p.payment_plan ? '<span class="pill">Plan '+esc(p.payment_plan)+'</span>' : '');

    var head =
      '<div class="dhead"><div style="min-width:0"><h1>'+esc(p.project_name)+'</h1>' +
        '<div class="loc"><span class="meta-ico">'+icon('developer','ico-dim',15)+esc(p.developer||'—')+'</span><span class="meta-ico">'+icon('location','ico-dim',15)+esc(p.location||'—')+'</span>'+(p.unit_no?'<span class="meta-ico">'+icon('home','ico-dim',15)+'Unit '+esc(p.unit_no)+'</span>':'')+'</div>' +
        '<div class="pills">'+pills+'</div></div>' +
        '<div class="dactions">' +
          '<button class="btn btn-ghost btn-sm desk-only" data-act="ics-prop" data-id="'+esc(p.id)+'">'+icon('calendar','',15)+' Add to calendar</button>' +
          '<button class="btn btn-ghost btn-sm" data-act="share-prop" data-id="'+esc(p.id)+'">Share summary</button>' +
          '<button class="btn btn-ghost btn-sm desk-only" data-act="print">'+icon('print','',15)+' Print</button></div></div>';

    // summary card
    var paidAmt = Number(p.total_paid_aed||0), pendAmt = Number(p.total_pending_aed||0);
    var openStates = [['overdue','Overdue','var(--bad)'],['soon','Due in 30 days','var(--warn)'],['upcoming','Upcoming','var(--surface-3)'],['undecided','Date TBC','var(--border-strong)']];
    var openRaw = openStates.reduce(function(a,d){ return a + sumAmt(b[d[0]]); }, 0), scale = openRaw > 0 ? pendAmt / openRaw : 0;

    else if(pendAmt > 0) segs.push({ label:'Remaining', color:'var(--surface-3)', amt:pendAmt });
    segs = segs.filter(function(d){ return d.amt > 0; });
    var segTotal = segs.reduce(function(a,d){ return a + d.amt; }, 0);
    var segBar = segTotal > 0 ? '<div class="seg-bar" role="img" aria-label="Payment progress by status">' + segs.map(function(d){ return '<i data-act="prop-tab" data-v="schedule" tabindex="0" role="button" style="flex:'+Math.max(d.amt,segTotal*0.01)+';background:'+d.color+'" title="'+esc(d.label+' · '+fmtMoney(d.amt))+' — open schedule"></i>'; }).join('') + '</div>' +
      '<div class="seg-legend">' + segs.map(function(d){ return '<span><span class="dot" style="background:'+d.color+'"></span>'+d.label+' <b>'+fmtCompact(d.amt)+'</b></span>'; }).join('') + '</div>' : barFill(pct,'lg');
    var nd = nm ? daysUntil(nm.due_date) : null, ns = nm ? milestoneState(nm) : null;
    var summary =
      '<section class="card dsum"><div class="dsum-top"><div><div class="dsum-paid'+fitCls(fmtMoney(p.total_paid_aed))+'">'+fmtMoney(p.total_paid_aed)+'</div><div class="dsum-of">paid of '+fmtMoney(p.total_unit_price_aed)+'</div></div><span class="dsum-pct">'+Math.round(pct*100)+'% paid</span></div>' +
      segBar +
      '<div class="dstats">' +
        '<div class="dstat"><div class="k">Remaining</div><div class="v">'+fmtCompact(p.total_pending_aed)+'</div><div class="s">'+(ms.length ? plural(ms.length - b.paid.length,'milestone')+' left' : (Number(p.total_pending_aed) > 0 ? 'no schedule added yet' : 'nothing left'))+'</div></div>' +
        '<div class="dstat"><div class="k">Next payment</div><div class="v '+(ns==='overdue'?'bad':ns==='soon'?'warn':'')+'">'+(nm ? relDays(nd) : (b.undecided.length ? 'Date TBC' : 'None'))+'</div><div class="s">'+(nm ? fmtCompact(mAmt(nm)) + ' · ' + fmtDateShort(nm.due_date) : '—')+'</div></div>' +
        '<div class="dstat"><div class="k">Handover</div><div class="v">'+(p.handover_date ? (hoDays >= 0 ? relMonths(p.handover_date).replace(/^in /,'') : 'Handed over') : '—')+'</div><div class="s">'+fmtDate(p.handover_date)+'</div></div>' +
        '<div class="dstat"><div class="k">Resale</div><div class="v '+(resale.eligible?'':'')+'">'+(resale.unknown ? 'Not recorded' : !resale.applicable ? 'Not allowed' : resale.eligible ? 'Eligible' : 'Not yet')+'</div><div class="s">'+(resale.applicable ? 'NOC at '+fmtPct(resale.reqPct)+' paid' : resale.unknown ? 'NOC terms not added' : 'Per contract')+'</div></div>' +

    );

  function renderOverview(p, ms, resale){
    var nm = nextMilestone(p.id), fc = resaleForecast(p, ms, resale);

    // Next up
    var nextCard;
    if(nm){
      var d = daysUntil(nm.due_date), st = milestoneState(nm);
      nextCard = '<section class="card nextup"><div class="nextup-top"><div class="card-title">Next payment</div><span class="pill '+STATE_PILL[st]+'">'+(st==='overdue' ? Math.abs(d)+' days overdue' : relDays(d))+'</span></div>' +
        '<h3>'+esc(nm.milestone_event)+'</h3><div class="when">Due '+fmtDate(nm.due_date)+(nm.pct!=null ? ' · '+fmtPct(nm.pct)+' of price' : '')+'</div>' +
        '<div class="amt'+fitCls(fmtMoney(mAmt(nm)))+'">'+fmtMoney(mAmt(nm))+'<small>+ VAT '+fmtCompact(nm.vat_aed)+'</small></div>' +
        '<div class="nextup-actions desk-only"><button class="btn btn-sm" data-act="ics-ms" data-id="'+esc(nm.id)+'">'+icon('calendar','',15)+' Remind me</button><button class="btn btn-ghost btn-sm" data-act="prop-tab" data-v="schedule">Full schedule</button></div></section>';
    } else {
      var undated = ms.filter(function(m){ return m.status !== 'Paid' && !m.due_date; }).length;
      nextCard = '<section class="card nextup"><div class="card-title">Next payment</div><div style="margin-top:14px;color:var(--ink-dim);line-height:1.55">'+(undated ? plural(undated,'remaining milestone')+' still waiting for a confirmed due date.' : (!ms.length && Number(p.total_pending_aed) > 0 ? 'No payment schedule has been added for this unit yet, so there is no next payment to show.' : 'Everything on this unit is paid. Nothing further is due.'))+'</div></section>';
    }

    // Journey
    var journey = journeyChart(p, ms, resale);
    var journeyCard = journey ? '<section class="card"><div class="card-head"><div><div class="card-title">Payment journey</div><div class="card-sub">Cumulative share of the price paid over time</div></div></div><div class="journey">'+journey+'</div></section>' : '';

    // Resale
    var resaleCard;
    if(!resale.applicable){
      resaleCard = resale.unknown
        ? '<div class="callout"><span class="c-ico">'+icon('resale','',18)+'</span><div><b>Resale terms not recorded</b><p>Add the developer\'s resale NOC requirement to see eligibility and a forecast date.</p></div></div>'
        : '<div class="callout"><span class="c-ico">'+icon('resale','',18)+'</span><div><b>Resale not permitted</b><p>This unit\'s contract does not allow resale at this stage.</p></div></div>';
    } else {
