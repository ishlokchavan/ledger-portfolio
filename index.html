          '<button class="btn btn-danger hide-mobile-inline" data-act="logout">'+icon('logout','',16)+' Log out</button></div>' +

        '<div class="card"><div class="card-head" style="padding-bottom:6px"><div class="card-title">Preferences</div></div>' +
          '<div class="pref"><div class="t"><b>Appearance</b><span>Match your device or choose a theme</span></div><div class="seg" role="group" aria-label="Theme">' +
            themeOpts.map(function(o){ return '<button data-act="theme" data-v="'+o[0]+'" class="'+(state.theme===o[0]?'active':'')+'" aria-pressed="'+(state.theme===o[0])+'" title="'+o[2]+'">'+icon(o[1],'',15)+'<span class="hide-xs"> '+o[2]+'</span></button>'; }).join('') + '</div></div>' +
          '<div class="pref"><div class="t"><b>Currency</b><span>1 AED = ₹'+esc(state.fxRate)+'</span></div><div class="seg seg-accent" role="group" aria-label="Currency"><button data-act="currency" data-v="AED" class="'+(state.currency==='AED'?'active':'')+'">AED</button><button data-act="currency" data-v="INR" class="'+(state.currency==='INR'?'active':'')+'">INR</button></div></div>' +
          '<div class="pref"><div class="t"><b>Hide amounts</b><span>Mask every figure — handy in public</span></div><button class="switch" role="switch" data-act="privacy" aria-checked="'+state.privacy+'" aria-label="Hide amounts"></button></div>' +
        '</div>' +

        '<div class="card"><div class="card-head" style="padding-bottom:6px"><div><div class="card-title">'+(isAdmin?'Client portfolios':'Portfolio access')+'</div><div class="card-sub">'+(isAdmin?'Tap a client to switch the whole app to their portfolio.':'You can only see portfolios you were added to.')+'</div></div></div>' +
          '<div style="padding-top:10px">'+(access || '<div class="empty-note" style="padding:20px;color:var(--ink-faint)">No portfolios assigned yet.</div>')+'</div></div>' +

        '<div class="card"><div class="card-head" style="padding-bottom:6px"><div class="card-title">Security</div></div>' +
          '<div class="callout" style="margin-top:14px"><span class="c-ico">'+icon('lock','',18)+'</span><div><b>Isolated at the database</b><p>Row-level security means even a direct request for another client\'s data is rejected by the server — not just hidden in the app.</p></div></div></div>' +

        '<div class="card"><div class="card-head" style="padding-bottom:6px"><div class="card-title">Shortcuts</div></div><div class="shortcuts">' +
          '<div class="sc"><span>Search &amp; commands</span><span class="kbd">'+mod+' K</span></div>' +
          '<div class="sc"><span>Go to Overview / Properties / Payments</span><span class="kbd">g o · g p · g y</span></div>' +
          '<div class="sc"><span>Toggle hide amounts</span><span class="kbd">h</span></div>' +
          '<div class="sc"><span>Switch currency</span><span class="kbd">c</span></div></div></div>' +

        '<div class="span2"><button class="btn btn-danger btn-block show-mobile-only" data-act="logout" style="margin-top:4px">'+icon('logout','',16)+' Log out</button>' +
        '<p class="about" style="margin-top:14px">Ledger · Amounts in lists exclude VAT unless marked</p></div>' +
      '</div>';
  }

  /* ---------------- TOASTS ---------------- */
  function toast(msg){
    var root = document.getElementById('toasts');
    var el = document.createElement('div'); el.className = 'toast'; el.innerHTML = icon('check','',15,2.6) + '<span>'+esc(msg)+'</span>';
    root.appendChild(el);
    setTimeout(function(){ el.classList.add('out'); setTimeout(function(){ el.remove(); }, 260); }, 2200);
  }

  /* ---------------- COMMAND PALETTE ---------------- */
  var pal = { open:false, q:'', idx:0, items:[], returnFocus:null };
  function paletteItems(){
    var items = [
      { g:'Go to', ico:'overview', t:'Overview', run:function(){ go(''); } },
      { g:'Go to', ico:'building', t:'Properties', run:function(){ go('properties'); } },
      { g:'Go to', ico:'wallet', t:'Payments', run:function(){ go('payments'); } },
      { g:'Go to', ico:'user', t:'Account', run:function(){ go('account'); } }
    ];
    state.properties.forEach(function(p){
      items.push({ g:'Properties', ico:'building', t:p.project_name, sub:(p.developer||''), hay:[p.project_name,p.developer,p.location].join(' '), run:function(){ go('properties/' + encodeURIComponent(p.id)); } });
    });
    items.push(
      { g:'Actions', ico:'eye', t:state.privacy ? 'Show amounts' : 'Hide amounts', sub:'H', run:function(){ setPrivacy(!state.privacy); } },
      { g:'Actions', ico:'money', t:'Switch to ' + (state.currency === 'AED' ? 'INR' : 'AED'), sub:'C', run:function(){ setCurrency(state.currency === 'AED' ? 'INR' : 'AED'); } },
      { g:'Actions', ico:'moon', t:'Theme: Light', run:function(){ setTheme('light'); } },
      { g:'Actions', ico:'moon', t:'Theme: Dark', run:function(){ setTheme('dark'); } },
      { g:'Actions', ico:'monitor', t:'Theme: Match device', run:function(){ setTheme('system'); } },
      { g:'Actions', ico:'download', t:'Export current payments as CSV', run:function(){ exportCsv(); } },
      { g:'Actions', ico:'logout', t:'Log out', run:function(){ doLogout(); } }
    );
    if(state.profile && state.profile.role === 'admin'){
      state.portfolios.forEach(function(pf){ items.push({ g:'Clients', ico:'users', t:'Switch to ' + pf.name, hay:pf.name, run:function(){ switchClient(pf.id); } }); });
    }
    return items;
  }
  function openPalette(){
    if(pal.open || !state.profile) return;
    pal.open = true; pal.q = ''; pal.idx = 0; pal.returnFocus = document.activeElement;
    document.getElementById('palette-root').innerHTML =
      '<div class="palette-back" id="palBack"><div class="palette" role="dialog" aria-modal="true" aria-label="Search and commands">' +
        '<div class="palette-input">'+icon('search','',20)+'<input id="palInput" type="text" placeholder="Search properties, pages, actions…" autocomplete="off" spellcheck="false" aria-label="Search"><span class="kbd">Esc</span></div>' +
        '<div class="palette-list" id="palList" role="listbox"></div>' +
        '<div class="palette-foot"><span><span class="kbd">↑↓</span>navigate</span><span><span class="kbd">↵</span>select</span></div>' +
      '</div></div>';
    paletteFilter(); document.getElementById('palInput').focus();
  }
  function closePalette(){
    if(!pal.open) return;
    pal.open = false; document.getElementById('palette-root').innerHTML = '';
    if(pal.returnFocus && pal.returnFocus.focus) try { pal.returnFocus.focus(); } catch(e){}
  }
  function paletteFilter(){
    var q = pal.q.trim().toLowerCase(), all = paletteItems();
    pal.items = q ? all.filter(function(i){ return (i.t + ' ' + (i.hay||'') + ' ' + i.g).toLowerCase().indexOf(q) !== -1; }) : all.filter(function(i){ return i.g !== 'Clients'; });
    if(pal.idx >= pal.items.length) pal.idx = 0;
    paletteDraw();
  }
  function paletteDraw(){
    var list = document.getElementById('palList'); if(!list) return;
    if(!pal.items.length){ list.innerHTML = '<div class="pl-empty">No results for “'+esc(pal.q)+'”</div>'; return; }
    var html = '', lastG = '';
    pal.items.forEach(function(it, i){
      if(it.g !== lastG){ html += '<div class="pl-group">'+esc(it.g)+'</div>'; lastG = it.g; }
      html += '<button class="pl-item'+(i===pal.idx?' sel':'')+'" role="option" aria-selected="'+(i===pal.idx)+'" data-pi="'+i+'"><span class="pi">'+icon(it.ico,'',16)+'</span><span>'+esc(it.t)+'</span>'+(it.sub?'<span class="sub">'+esc(it.sub)+'</span>':'')+'</button>';
    });
    list.innerHTML = html;
    var s = list.querySelector('.sel'); if(s && s.scrollIntoView) s.scrollIntoView({ block:'nearest' });
  }
  function paletteRun(i){
    var it = pal.items[i]; if(!it) return;
    closePalette(); it.run();
  }

  /* ---------------- actions ---------------- */
  function setCurrency(c){ state.currency = c; lsSet('ledger_currency', c); render(); }
  function setPrivacy(on){ state.privacy = on; lsSet('ledger_privacy', on ? '1' : '0'); render(); toast(on ? 'Amounts hidden' : 'Amounts visible'); }
  function setTheme(t){ state.theme = t; lsSet('ledger_theme', t); applyTheme(t); render(); }
  async function switchClient(id){
    if(id === state.currentPortfolioId) return;
    state.currentPortfolioId = id;
    state.propQuery = ''; state.propFilter = 'all'; state.payProp = 'all'; state.payQuery = ''; state.payYear = 'all';
    renderSkeleton();
    try { await loadPortfolioData(); } catch(e){ renderFatal('We could not load that client.', true); return; }
    state.route = { tab:'dashboard' }; location.hash = '#/'; state.animate = true; render();
    var pf = state.portfolios.find(function(p){ return p.id === id; });
    toast('Now viewing ' + (pf ? pf.name : 'client'));
  }

  var actions = {
    nav: function(el){ go(el.getAttribute('data-to')); },
    'open-prop': function(el){
      var goSched = el.hasAttribute('data-goto-sched');
      var id = el.getAttribute('data-id');
      state.propTab = goSched ? 'schedule' : 'overview'; state.tlView = 'timeline';
      go('properties/' + encodeURIComponent(id));
    },
    currency: function(el){ setCurrency(el.getAttribute('data-v')); },
    privacy: function(){ setPrivacy(!state.privacy); },
    theme: function(el){ setTheme(el.getAttribute('data-v')); },
    palette: function(){ openPalette(); },
    logout: function(){ doLogout(); },
    retry: function(){ if(state.profile){ loadEverything(); } else { init(); } },
    reload: function(){ location.reload(); },
    'pay-tab': function(el){ state.payTab = el.getAttribute('data-tab'); state.payProp = 'all'; state.payQuery = ''; state.payYear = 'all'; go('payments'); },
    'pay-tab-local': function(el){ state.payTab = el.getAttribute('data-tab'); refreshPayments(); },
    'pay-view': function(el){ state.payView = el.getAttribute('data-v'); render(); },
    'prop-filter': function(el){ state.propFilter = el.getAttribute('data-v'); render(); },
    'prop-filter-go': function(el){ state.propFilter = el.getAttribute('data-v') || el.getAttribute('data-tab'); go('properties'); },
    'clear-prop-filters': function(){ state.propQuery = ''; state.propFilter = 'all'; render(); },
    'clear-pay-filters': function(){ state.payQuery = ''; state.payYear = 'all'; state.payProp = 'all'; render(); },
    'prop-tab': function(el){ state.propTab = el.getAttribute('data-v'); render(); },
    'tl-view': function(el){ state.tlView = el.getAttribute('data-v'); render(); },
    export: function(){ exportCsv(); },
    'switch-client': function(el){ switchClient(el.getAttribute('data-id')); },
    cf: function(el){
      var i = Number(el.getAttribute('data-i')); state.cfSel = state.cfSel === i ? null : i;
      var cols = cashflow(), sel = state.cfSel != null ? cols[state.cfSel] : null;
      var total12 = cols.reduce(function(a,c){ return a + (c.kind === 'm' ? c.amt : 0); }, 0);
      document.getElementById('cfBig').textContent = fmtMoney(sel ? sel.amt : total12);
      document.getElementById('cfLbl').textContent = sel ? sel.full + ' · ' + plural(sel.n,'payment') : 'due over the next 12 months';
      document.querySelectorAll('#cfChart .cf-col').forEach(function(c, k){ c.classList.toggle('sel', k === state.cfSel); });
    },
    'toggle-pw': function(el){
      var inp = document.getElementById('password'), show = inp.type === 'password';
      inp.type = show ? 'text' : 'password'; el.innerHTML = icon(show ? 'eyeOff' : 'eye','',18); el.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    },
    demo: function(el){
      document.getElementById('email').value = el.getAttribute('data-email');
      document.getElementById('password').value = el.getAttribute('data-pass');
      document.getElementById('loginBtn').focus();
    }
  };

  /* ---------------- delegated events ---------------- */
  document.addEventListener('click', function(e){
    var pi = e.target.closest && e.target.closest('[data-pi]');
    if(pi){ paletteRun(Number(pi.getAttribute('data-pi'))); return; }
    if(pal.open && e.target.id === 'palBack'){ closePalette(); return; }
    var el = e.target.closest && e.target.closest('[data-act]');
    if(!el || !app.contains(el)) return;
    var fn = actions[el.getAttribute('data-act')];
    if(fn){ if(el.tagName === 'A') e.preventDefault(); fn(el, e); }
  });

  document.addEventListener('submit', function(e){
    if(e.target.id !== 'loginForm') return;
    e.preventDefault();
    var email = document.getElementById('email').value.trim(), pass = document.getElementById('password').value;
    if(!email || !pass){ showLoginError('Enter your email and password.'); return; }
    doLogin(email, pass, document.getElementById('loginBtn'));
  });

  var debounceT = null;
  document.addEventListener('input', function(e){
    var id = e.target.id;
    if(id === 'palInput'){ pal.q = e.target.value; pal.idx = 0; paletteFilter(); return; }
    if(id === 'propSearch'){
      state.propQuery = e.target.value;
      clearTimeout(debounceT); debounceT = setTimeout(function(){ var r = document.getElementById('propResults'); if(r) r.innerHTML = propertyResults(); }, 90);
    } else if(id === 'paySearch'){
      state.payQuery = e.target.value;
      clearTimeout(debounceT); debounceT = setTimeout(refreshPayments, 90);
    }
  });
  document.addEventListener('change', function(e){
    var id = e.target.id, v = e.target.value;
    if(id === 'propSort'){ state.propSort = v; var r = document.getElementById('propResults'); if(r) r.innerHTML = propertyResults(); }
    else if(id === 'payProp'){ state.payProp = v; refreshPayments(); }
    else if(id === 'payYear'){ state.payYear = v; refreshPayments(); }
    else if(id === 'portfolioSwitch' || id === 'portfolioSwitchM'){ switchClient(v); }
  });

  var chord = null, chordT = null;
  document.addEventListener('keydown', function(e){
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); pal.open ? closePalette() : openPalette(); return; }
    if(pal.open){
      if(e.key === 'Escape'){ e.preventDefault(); closePalette(); }
      else if(e.key === 'ArrowDown'){ e.preventDefault(); pal.idx = (pal.idx + 1) % Math.max(1, pal.items.length); paletteDraw(); }
      else if(e.key === 'ArrowUp'){ e.preventDefault(); pal.idx = (pal.idx - 1 + pal.items.length) % Math.max(1, pal.items.length); paletteDraw(); }
      else if(e.key === 'Enter'){ e.preventDefault(); paletteRun(pal.idx); }
      else if(e.key === 'Tab'){ e.preventDefault(); }
      return;
    }
    var tag = (e.target.tagName || '').toLowerCase();
    if(tag === 'input' || tag === 'textarea' || tag === 'select' || e.metaKey || e.ctrlKey || e.altKey || !state.profile) return;
    var k = e.key.toLowerCase();
    if(chord === 'g'){
      chord = null; clearTimeout(chordT);
      if(k === 'o') go(''); else if(k === 'p') go('properties'); else if(k === 'y') go('payments'); else if(k === 'a') go('account');
      return;
    }
    if(k === 'g'){ chord = 'g'; clearTimeout(chordT); chordT = setTimeout(function(){ chord = null; }, 900); }
    else if(k === 'h') setPrivacy(!state.privacy);
    else if(k === 'c') setCurrency(state.currency === 'AED' ? 'INR' : 'AED');
    else if(k === '/'){ var s = document.getElementById('propSearch') || document.getElementById('paySearch'); if(s){ e.preventDefault(); s.focus(); } else { e.preventDefault(); openPalette(); } }
  });

  /* animate cash-flow bars after the first paint (they start collapsed) */
  var cfObserver = new MutationObserver(function(){
    var bars = document.querySelectorAll('#cfChart .b[data-h]');
    if(!bars.length) return;
    var need = false; bars.forEach(function(b){ if(b.style.height !== b.getAttribute('data-h') + '%') need = true; });
    if(!need) return;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ bars.forEach(function(b){ b.style.height = b.getAttribute('data-h') + '%'; }); }); });
  });
  cfObserver.observe(app, { childList:true, subtree:true });

  init();
})();
</script>
</body>
</html>
