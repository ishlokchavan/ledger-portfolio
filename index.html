<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f5">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Ledger — off-plan real estate portfolio tracker">
<title>Ledger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f7d72'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' text-anchor='middle' fill='white'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<style>
  /* =====================================================================
     DESIGN TOKENS
     ===================================================================== */
  :root{
    --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eef1ef; --surface-3:#e4e9e6; --border:#dde2df; --border-strong:#c8d0cc;
    --ink:#101816; --ink-dim:#55635f; --ink-faint:#86928f;
    --accent:#0f7d72; --accent-strong:#0b6259; --accent-ink:#ffffff; --accent-soft:#e0f1ee;
    --good:#1c8a4a; --good-soft:#e3f5e9;
    --warn:#a06a14; --warn-soft:#faf0d9;
    --bad:#c23b32; --bad-soft:#fbe8e5;
    --info:#3b6fb6; --info-soft:#e6eefa;
    --hero-a:#0b3d38; --hero-b:#0a1f24; --hero-ink:#f0faf8; --hero-dim:rgba(240,250,248,.66);
    --shadow-sm:0 1px 2px rgba(16,24,22,.05);
    --shadow:0 1px 2px rgba(16,24,22,.05), 0 10px 28px -14px rgba(16,24,22,.16);
    --shadow-lg:0 2px 6px rgba(16,24,22,.06), 0 24px 60px -20px rgba(16,24,22,.28);
    --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px;
    --ease:cubic-bezier(.22,.8,.24,1);
    --sidebar-w:264px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#080e0d; --surface:#0e1816; --surface-2:#142320; --surface-3:#1b2e2a; --border:#1f302d; --border-strong:#2c433e;
      --ink:#edf3f1; --ink-dim:#95a8a3; --ink-faint:#61756f;
      --accent:#3fd6c4; --accent-strong:#6fe6d7; --accent-ink:#04201c; --accent-soft:#0f2a26;
      --good:#52c081; --good-soft:#102a1a;
      --warn:#e3ac41; --warn-soft:#2b2110;
      --bad:#ea6d64; --bad-soft:#2d1512;
      --info:#7aa7e6; --info-soft:#12213a;
      --hero-a:#0d4a43; --hero-b:#07161a;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
      --shadow-lg:0 2px 6px rgba(0,0,0,.35), 0 24px 60px -20px rgba(0,0,0,.7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#080e0d; --surface:#0e1816; --surface-2:#142320; --surface-3:#1b2e2a; --border:#1f302d; --border-strong:#2c433e;
    --ink:#edf3f1; --ink-dim:#95a8a3; --ink-faint:#61756f;
    --accent:#3fd6c4; --accent-strong:#6fe6d7; --accent-ink:#04201c; --accent-soft:#0f2a26;
    --good:#52c081; --good-soft:#102a1a;
    --warn:#e3ac41; --warn-soft:#2b2110;
    --bad:#ea6d64; --bad-soft:#2d1512;
    --info:#7aa7e6; --info-soft:#12213a;
    --hero-a:#0d4a43; --hero-b:#07161a;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    --shadow-lg:0 2px 6px rgba(0,0,0,.35), 0 24px 60px -20px rgba(0,0,0,.7);
    color-scheme: dark;
  }

  /* =====================================================================
     BASE
     ===================================================================== */
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; min-height:100%; }
  body{ background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4,.serif{ font-family:'Fraunces',Georgia,serif; text-wrap:balance; margin:0; font-weight:600; letter-spacing:-.01em; }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  p{ margin:0; }
  a{ color:var(--accent); }
  button{ font-family:inherit; color:inherit; }
  input,select{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); color:var(--ink); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  [hidden]{ display:none !important; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .skip-link{ position:absolute; left:12px; top:-60px; z-index:200; background:var(--accent); color:var(--accent-ink); padding:9px 14px; border-radius:8px; font-weight:600; text-decoration:none; transition:top .2s; }
  .skip-link:focus{ top:12px; }

  #app{ min-height:100vh; }

  /* buttons */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px; border-radius:var(--r-md);
    border:1px solid transparent; background:var(--accent); color:var(--accent-ink); font-weight:600; font-size:14px; cursor:pointer;
    transition:transform .12s var(--ease), background .15s, box-shadow .15s; min-height:44px; text-decoration:none;
  }
  .btn:hover{ background:var(--accent-strong); }
  .btn:active{ transform:translateY(1px) scale(.99); }
  .btn:disabled{ opacity:.6; cursor:default; }
  .btn-block{ width:100%; }
  .btn-ghost{ background:transparent; border-color:var(--border-strong); color:var(--ink); }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-danger{ background:transparent; border-color:var(--border-strong); color:var(--bad); }
  .btn-danger:hover{ background:var(--bad-soft); }
  .btn-sm{ padding:7px 12px; min-height:34px; font-size:12.5px; border-radius:var(--r-sm); }
  .icon-btn{
    width:40px; height:40px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface);
    color:var(--ink-dim); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
    transition:background .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .icon-btn.on{ background:var(--accent-soft); border-color:transparent; color:var(--accent); }

  /* icons */
  .ico{ flex:none; vertical-align:-3px; }
  .ico-dim{ color:var(--ink-faint); }
  .meta-ico{ display:inline-flex; align-items:center; gap:5px; }

  /* segmented control */
  .seg{ display:inline-flex; padding:3px; gap:2px; border-radius:var(--r-md); background:var(--surface-2); border:1px solid var(--border); }
  .seg button{
    border:none; background:transparent; color:var(--ink-dim); font-weight:600; font-size:12.5px; padding:0 13px; min-height:32px;
    border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:background .15s, color .15s;
  }
  .seg button:hover{ color:var(--ink); }
  .seg button.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm); }
  .seg.seg-accent button.active{ background:var(--accent); color:var(--accent-ink); }

  /* pills */
  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 10px; border-radius:99px;
    white-space:nowrap; letter-spacing:.1px; background:var(--surface-2); color:var(--ink-dim);
  }
  .pill.accent{ background:var(--accent-soft); color:var(--accent); }
  .pill.good{ background:var(--good-soft); color:var(--good); }
  .pill.warn{ background:var(--warn-soft); color:var(--warn); }
  .pill.bad{ background:var(--bad-soft); color:var(--bad); }
  .pill.info{ background:var(--info-soft); color:var(--info); }

  /* cards */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow); }
  .card-pad{ padding:20px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:18px 20px 0; }
  .card-title{ font-size:15px; font-family:'Inter',sans-serif; font-weight:700; letter-spacing:0; }
  .card-sub{ font-size:12.5px; color:var(--ink-dim); margin-top:2px; }
  .link-btn{ background:none; border:none; color:var(--accent); font-weight:600; font-size:12.5px; cursor:pointer; padding:4px 0; display:inline-flex; align-items:center; gap:4px; }
  .link-btn:hover{ text-decoration:underline; }

  /* progress */
  .bar{ height:8px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
  .bar > i{ display:block; height:100%; border-radius:99px; background:var(--accent); transition:width .9s var(--ease); }
  .bar.lg{ height:12px; }
  .bar.on-hero{ background:rgba(255,255,255,.14); }
  .bar.on-hero > i{ background:linear-gradient(90deg,#5eead4,#a7f3d0); }

  /* =====================================================================
     LOGIN
     ===================================================================== */
  .login{ min-height:100vh; display:grid; grid-template-columns:1fr; }
  .login-aside{
    display:none; position:relative; overflow:hidden; color:var(--hero-ink); padding:48px 56px;
    background:radial-gradient(900px 500px at 15% 0%, rgba(94,234,212,.22), transparent 60%),
      radial-gradient(700px 500px at 100% 100%, rgba(15,125,114,.45), transparent 60%),
      linear-gradient(160deg,var(--hero-a),var(--hero-b));
  }
  .login-aside::after{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:44px 44px; mask-image:radial-gradient(circle at 30% 30%, #000 0%, transparent 70%);
  }
  .login-aside > *{ position:relative; z-index:1; }
  .login-aside h2{ font-size:clamp(30px,3.2vw,44px); line-height:1.1; margin:56px 0 18px; max-width:480px; }
  .login-aside p.lead{ color:var(--hero-dim); font-size:16px; max-width:430px; line-height:1.6; }
  .login-points{ list-style:none; padding:0; margin:36px 0 0; display:flex; flex-direction:column; gap:16px; max-width:440px; }
  .login-points li{ display:flex; gap:14px; align-items:flex-start; font-size:14px; color:var(--hero-dim); line-height:1.5; }
  .login-points b{ color:var(--hero-ink); display:block; font-weight:600; }
  .lp-ico{ width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; flex:none; color:#8ff0e0; }
  .login-main{
    display:flex; align-items:center; justify-content:center; padding:32px 20px;
    background:radial-gradient(ellipse 800px 420px at 50% -10%, var(--accent-soft), transparent 65%), var(--bg);
  }
  .login-card{ width:100%; max-width:400px; }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand-mark{
    width:38px; height:38px; border-radius:11px; background:linear-gradient(145deg,var(--accent),var(--accent-strong)); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:20px; flex:none;
    box-shadow:0 6px 16px -6px var(--accent);
  }
  .brand-name{ font-family:'Fraunces',serif; font-weight:600; font-size:20px; letter-spacing:-.01em; line-height:1; }
  .brand-tag{ font-size:12px; color:var(--ink-faint); margin-top:3px; }
  .login-aside .brand-mark{ background:rgba(255,255,255,.14); color:#fff; box-shadow:none; border:1px solid rgba(255,255,255,.18); }
  .login-aside .brand-tag{ color:var(--hero-dim); }
  .login-mobile-brand{ margin-bottom:30px; }
  .login-title{ font-size:28px; margin-bottom:6px; }
  .login-desc{ color:var(--ink-dim); font-size:14.5px; margin-bottom:24px; line-height:1.55; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-dim); margin-bottom:7px; }
  .input-wrap{ position:relative; }
  .input{
    width:100%; padding:12px 14px; min-height:46px; border-radius:var(--r-md); border:1px solid var(--border-strong);
    background:var(--surface); color:var(--ink); font-size:15px; transition:border-color .15s, box-shadow .15s;
  }
  .input::placeholder{ color:var(--ink-faint); }
  .input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .input-wrap .icon-btn{ position:absolute; right:3px; top:3px; width:40px; height:40px; border:none; background:transparent; }
  .input-wrap.has-ico .input{ padding-left:40px; }
  .input-wrap.has-ico > .ico{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--ink-faint); pointer-events:none; }
  .form-error{ background:var(--bad-soft); color:var(--bad); font-size:13px; padding:11px 13px; border-radius:var(--r-md); margin-bottom:16px; line-height:1.4; display:flex; gap:9px; align-items:flex-start; }
  .demo{ margin-top:26px; }
  .demo-label{ font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.7px; margin-bottom:10px; display:flex; align-items:center; gap:10px; }
  .demo-label::after{ content:""; flex:1; height:1px; background:var(--border); }
  .demo-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .demo-chip{
    text-align:left; padding:12px 13px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface);
    cursor:pointer; transition:border-color .15s, transform .12s var(--ease), box-shadow .15s;
  }
  .demo-chip:hover{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .demo-chip:active{ transform:scale(.98); }
  .demo-chip b{ display:block; font-size:13px; }
  .demo-chip span{ font-size:11.5px; color:var(--ink-faint); }
  .login-foot{ margin-top:28px; font-size:12px; color:var(--ink-faint); display:flex; gap:7px; align-items:center; line-height:1.5; }

  /* =====================================================================
     APP SHELL
     ===================================================================== */
  .shell{ min-height:100vh; }
  .sidebar{ display:none; }
  .content{ min-width:0; }
  .topbar{
    position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px; min-height:60px;
    padding:max(10px, env(safe-area-inset-top)) 16px 10px;
    background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px);
    border-bottom:1px solid var(--border);
  }
  .topbar .brand-mark{ width:30px; height:30px; font-size:16px; border-radius:9px; }
  .topbar .brand-name{ font-size:17px; }
  .topbar-title{ display:none; font-size:20px; }
  .topbar-crumbs{ display:none; align-items:center; gap:8px; min-width:0; }
  .topbar-spacer{ flex:1; }
  .tools{ display:flex; align-items:center; gap:8px; }
  .tools .seg button{ padding:0 11px; }
  .search-trigger{
    display:none; align-items:center; gap:10px; min-height:40px; padding:0 8px 0 13px; border-radius:var(--r-md);
    border:1px solid var(--border); background:var(--surface); color:var(--ink-faint); cursor:pointer; font-size:13px; min-width:210px;
  }
  .search-trigger:hover{ border-color:var(--border-strong); }
  .search-trigger kbd, .kbd{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:2px 6px; border-radius:6px; border:1px solid var(--border-strong);
    background:var(--surface-2); color:var(--ink-dim); margin-left:auto;
  }
  .client-strip{ display:flex; align-items:center; gap:10px; margin-bottom:16px; padding:10px 12px; border-radius:var(--r-md); background:var(--accent-soft); color:var(--accent); font-weight:600; font-size:12.5px; }
  .client-strip select{ flex:1; min-width:0; background:transparent; border:none; color:inherit; font-weight:700; font-size:13.5px; cursor:pointer; }

  .page{ padding:20px 16px calc(96px + env(safe-area-inset-bottom)); max-width:1180px; margin:0 auto; }
  .page.enter > *{ animation:rise .5s var(--ease) both; }
  .page.enter > *:nth-child(2){ animation-delay:.04s; } .page.enter > *:nth-child(3){ animation-delay:.08s; }
  .page.enter > *:nth-child(4){ animation-delay:.12s; } .page.enter > *:nth-child(5){ animation-delay:.16s; }
  .page.enter > *:nth-child(6){ animation-delay:.2s; }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }

  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
  .page-head h1{ font-size:clamp(24px,4vw,32px); line-height:1.15; }
  .page-head p{ color:var(--ink-dim); margin-top:5px; font-size:14px; }

  /* bottom nav (mobile) */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; justify-content:space-around;
    background:color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter:saturate(1.4) blur(16px); -webkit-backdrop-filter:saturate(1.4) blur(16px);
    border-top:1px solid var(--border); padding:6px 8px max(8px, env(safe-area-inset-bottom));
  }
  .nav-btn{
    position:relative; flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-faint); font-size:10.5px; font-weight:600; padding:7px 4px 5px; border-radius:12px; cursor:pointer; min-height:52px;
    transition:color .15s;
  }
  .nav-btn .nav-ico{ width:22px; height:22px; transition:transform .2s var(--ease); }
  .nav-btn.active{ color:var(--accent); }
  .nav-btn.active .nav-ico{ transform:translateY(-1px) scale(1.08); }
  .nav-btn.active::before{ content:""; position:absolute; top:-7px; left:50%; width:22px; height:3px; margin-left:-11px; border-radius:0 0 4px 4px; background:var(--accent); }
  .nav-badge{ position:absolute; top:3px; left:calc(50% + 6px); min-width:16px; height:16px; padding:0 4px; border-radius:99px; background:var(--bad); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }

  /* sidebar internals */
  .sb-brand{ padding:6px 8px 20px; }
  .sb-nav{ display:flex; flex-direction:column; gap:3px; }
  .sb-link{
    position:relative; display:flex; align-items:center; gap:12px; padding:0 12px; min-height:42px; border-radius:var(--r-md); border:none; background:none;
    color:var(--ink-dim); font-weight:600; font-size:14px; cursor:pointer; text-align:left; width:100%; transition:background .15s, color .15s;
  }
  .sb-link:hover{ background:var(--surface-2); color:var(--ink); }
  .sb-link.active{ background:var(--accent-soft); color:var(--accent); }
  .sb-link .badge{ margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:99px; background:var(--bad-soft); color:var(--bad); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .sb-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--ink-faint); margin:22px 12px 8px; }
  .sb-client{ padding:12px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface); }
  .sb-client select{ width:100%; margin-top:6px; padding:9px 10px; border-radius:var(--r-sm); border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-weight:600; font-size:13px; cursor:pointer; }
  .sb-client .nm{ font-weight:700; font-size:14px; margin-top:4px; }
  .sb-spacer{ flex:1; }
  .sb-user{ display:flex; align-items:center; gap:11px; padding:12px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface); }
  .avatar{
    width:38px; height:38px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;
    background:linear-gradient(145deg,var(--accent),var(--accent-strong)); color:var(--accent-ink);
  }
  .avatar.lg{ width:64px; height:64px; font-size:24px; font-family:'Fraunces',serif; }
  .sb-user .who{ min-width:0; flex:1; }
  .sb-user .who b{ display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sb-user .who span{ font-size:11.5px; color:var(--ink-faint); }

  /* =====================================================================
     DASHBOARD
     ===================================================================== */
  .grid{ display:grid; gap:14px; }
  .grid > *, .d-grid > *, .g-account > *, .prop-grid > *{ min-width:0; }
  .g-hero{ grid-template-columns:1fr; }
  .g-kpi{ grid-template-columns:1fr 1fr; margin-top:14px; }
  .g-two{ grid-template-columns:1fr; margin-top:14px; }
  .hero{

  /* ---------------- domain logic ---------------- */
  function milestoneState(m){
    if(m.status === 'Paid') return 'paid';
    if(!m.due_date) return 'undecided';
    var d = daysUntil(m.due_date);
    if(d < 0) return 'overdue';
    if(d <= 30) return 'soon';
    return 'upcoming';
  }
  var STATE_LABEL = { paid:'Paid', overdue:'Overdue', soon:'Due soon', upcoming:'Upcoming', undecided:'Date TBC' };
  var STATE_PILL = { paid:'good', overdue:'bad', soon:'warn', upcoming:'', undecided:'' };
  function mAmt(m){ return Number(m.amount_aed || 0); }
  function propOf(id){ return state.properties.find(function(p){ return p.id === id; }); }
  function byDue(a, b){ return new Date(a.due_date || '2099-01-01') - new Date(b.due_date || '2099-01-01'); }
  function paidPct(p){ return Number(p.total_unit_price_aed) > 0 ? Number(p.total_paid_aed||0) / Number(p.total_unit_price_aed) : 0; }

  function resaleEligibility(p){
    var applicable = String(p.resale_applicable||'').toUpperCase() === 'YES';
    if(!applicable) return { applicable:false, eligible:false };
    var req = Number(p.resale_noc_pct||0), pd = paidPct(p);
    return { applicable:true, eligible: pd >= req, reqPct:req, paidPct:pd };
  }

  function nextMilestone(pid){
    var list = state.milestones.filter(function(m){ return m.property_id === pid && m.status !== 'Paid' && m.due_date; }).sort(byDue);
    return list[0] || null;
  }

  function portfolioTotals(){
    var v=0, pd=0, pe=0;
    state.properties.forEach(function(p){ v += Number(p.total_unit_price_aed||0); pd += Number(p.total_paid_aed||0); pe += Number(p.total_pending_aed||0); });
    return { value:v, paid:pd, pending:pe, pct: v > 0 ? pd / v : 0 };
  }

  function bucketMilestones(list){
    var b = { overdue:[], soon:[], upcoming:[], undecided:[], paid:[] };
    list.forEach(function(m){ b[milestoneState(m)].push(m); });
    return b;
  }
  function sumAmt(list){ return list.reduce(function(a, m){ return a + mAmt(m); }, 0); }

  function cashflow(){
    var months = [], i;
    for(i = 0; i < 12; i++){
      var d = new Date(TODAY.getFullYear(), TODAY.getMonth() + i, 1);
      months.push({ key: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'), label: d.toLocaleDateString('en-US', { month:'short' }), full: d.toLocaleDateString('en-GB', { month:'long', year:'numeric' }), amt:0, n:0, kind:'m' });
    }
    var od = { key:'od', label:'Late', full:'Overdue', amt:0, n:0, kind:'od' };
    var later = { key:'later', label:'Later', full:'Beyond 12 months', amt:0, n:0, kind:'later' };
    state.milestones.forEach(function(m){
      if(m.status === 'Paid' || !m.due_date) return;
      var st = milestoneState(m);
      if(st === 'overdue'){ od.amt += mAmt(m); od.n++; return; }
      var slot = months.find(function(x){ return x.key === m.due_date.slice(0,7); });
      if(slot){ slot.amt += mAmt(m); slot.n++; } else { later.amt += mAmt(m); later.n++; }
    });
    var cols = months.slice();
    if(od.n) cols.unshift(od);
    if(later.n) cols.push(later);
    return cols;
  }

  var PALETTES = [['#0f766e','#164e63'],['#4338ca','#1e3a8a'],['#9a3412','#7f1d1d'],['#166534','#134e4a'],['#6d28d9','#4c1d95'],['#0e7490','#1e40af'],['#a16207','#854d0e'],['#be185d','#831843']];
  function coverVars(p){
    var s = String(p.developer || p.project_name || ''), h = 0, i;
    for(i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    var pal = PALETTES[h % PALETTES.length];
    return '--c1:'+pal[0]+';--c2:'+pal[1]+';';
  }

  /* ---------------- data ---------------- */
  async function init(){
    renderSkeleton();
    if(!sb){ renderFatal('We could not reach the portfolio service. Check your connection and try again.'); return; }
    try {
      var res = await sb.auth.getSession();
      var session = res.data ? res.data.session : null;
      if(session){ state.session = session; await loadEverything(); }
      else { renderLogin(); }
    } catch(e){ renderFatal('Something went wrong while starting up.'); }
  }

  async function loadEverything(){
    renderSkeleton();
    try {
      var userId = state.session.user.id;
      var profRes = await sb.from('profiles').select('*').eq('id', userId).single();
      if(profRes.error || !profRes.data){ renderLogin('Could not load your profile. Please try again.'); return; }
      state.profile = profRes.data;

      var portRes = await sb.from('portfolios').select('*').order('name');
      state.portfolios = portRes.data || [];
      if(!state.currentPortfolioId && state.portfolios.length) state.currentPortfolioId = state.portfolios[0].id;

      var fxRes = await sb.from('fx_rates').select('*').eq('id', 1).single();
      if(fxRes.data) state.fxRate = fxRes.data.aed_to_inr;

      await loadPortfolioData();
      state.route = parseHash();
      state.animate = true;
      render();
    } catch(e){
      state.loadError = 'We could not load your portfolio.';
      renderFatal(state.loadError, true);
    }
  }

  async function loadPortfolioData(){
    state.loadError = '';
    if(!state.currentPortfolioId){ state.properties = []; state.milestones = []; return; }
    var propRes = await sb.from('properties').select('*').eq('portfolio_id', state.currentPortfolioId).order('purchase_date');
    if(propRes.error){ throw propRes.error; }
    state.properties = propRes.data || [];
    var ids = state.properties.map(function(p){ return p.id; });
    if(ids.length){
      var msRes = await sb.from('payment_milestones').select('*').in('property_id', ids).order('due_date');
      if(msRes.error){ throw msRes.error; }
      state.milestones = msRes.data || [];
    } else { state.milestones = []; }
  }

  async function doLogin(email, password, btn){
    btn.disabled = true; btn.innerHTML = 'Signing in…';
    var res;
    try { res = await sb.auth.signInWithPassword({ email:email, password:password }); }
    catch(e){ res = { error:{ message:'Network error. Please try again.' } }; }
    if(res.error){
      btn.disabled = false; btn.innerHTML = 'Log in ' + icon('arrowRight','',16,2);
      showLoginError(res.error.message === 'Invalid login credentials' ? 'Incorrect email or password.' : res.error.message);
      return;
    }
    state.session = res.data.session;
    await loadEverything();
  }

  /* ---------------- routing ---------------- */
  function parseHash(){
    var parts = (location.hash || '').replace(/^#\/?/, '').split('/');
    if(parts[0] === 'properties' && parts[1]) return { tab:'detail', id:decodeURIComponent(parts[1]) };
    if(parts[0] === 'properties' || parts[0] === 'payments' || parts[0] === 'account') return { tab:parts[0] };
    return { tab:'dashboard' };
  }
  function go(path){
    var target = '#/' + path;
    if(location.hash === target){ state.route = parseHash(); render(); return; }
    location.hash = target;
  }
  window.addEventListener('hashchange', function(){
    if(!state.profile) return;
    var prev = state.route; state.route = parseHash();
    if(prev.tab !== state.route.tab || prev.id !== state.route.id){
      if(state.route.tab === 'detail'){ state.propTab = 'overview'; state.tlView = 'timeline'; }
      state.animate = true; render(); window.scrollTo(0, 0);
    }
  });

    var r = state.route;
    if(r.tab === 'dashboard') return { title:'Overview' };

    if(r.tab === 'detail'){ var p = propOf(r.id); return { title: p ? p.project_name : 'Property' }; }
    if(r.tab === 'payments') return { title:'Payments' };
    return { title:'Account' };

  function ring(pct, size, stroke, cls, label){
    var r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.min(1, Math.max(0, pct)));
    var startOff = (REDUCED || !state.animate) ? off : c;
    return '<div class="ring '+(cls||'')+'" style="width:'+size+'px;height:'+size+'px" role="img" aria-label="'+Math.round(pct*100)+'% paid">' +
      '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient></defs>' +
      '<circle class="track" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke-width="'+stroke+'"/>' +
      '<circle class="prog" data-off="'+off+'" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+startOff+'"/></svg>' +
      '<div class="ring-label"><b>'+Math.round(pct*100)+'%</b><span>'+esc(label||'paid')+'</span></div></div>';
  }

    var ms = app.querySelector('.hide-desktop-search');
    if(ms && window.matchMedia('(max-width: 899px)').matches) ms.style.display = 'inline-flex';

    postRender();
    state.animate = false;
  }

  /* after every render: kick off ring/bar/count animations */
  function postRender(){
    if(REDUCED) return;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      app.querySelectorAll('.ring .prog[data-off]').forEach(function(c){ c.style.strokeDashoffset = c.getAttribute('data-off'); });
      app.querySelectorAll('.bar > i[data-w]').forEach(function(b){ b.style.width = b.getAttribute('data-w'); });
    }); });
    app.querySelectorAll('[data-count]').forEach(function(el){
      if(!el.hasAttribute('data-anim')) return;
      var target = Number(el.getAttribute('data-count')), t0 = null, dur = 900;
      function tick(ts){
        if(t0 === null) t0 = ts;
        var k = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        el.textContent = fmtMoney(target * e);
        if(k < 1) requestAnimationFrame(tick); else el.textContent = fmtMoney(target);
      }
      if(!state.privacy) requestAnimationFrame(tick);
    });
  }
  function barFill(pct, extraCls){
    var w = Math.round(Math.min(1, Math.max(0, pct)) * 100) + '%';
    var start = (REDUCED || !state.animate) ? w : '0%';
    return '<div class="bar '+(extraCls||'')+'" role="progressbar" aria-valuenow="'+parseInt(w,10)+'" aria-valuemin="0" aria-valuemax="100"><i data-w="'+w+'" style="width:'+start+'"></i></div>';
  }

  /* ---------------- DASHBOARD ---------------- */
  function renderDashboard(){
    var t = portfolioTotals(), b = bucketMilestones(state.milestones);
    var portfolio = state.portfolios.find(function(p){ return p.id === state.currentPortfolioId; });

    if(!state.properties.length){
      return '<div class="page-head"><div><h1>'+greeting()+', '+esc(firstName(state.profile.full_name))+'</h1><p>'+esc(portfolio ? portfolio.name : 'Your portfolio')+'</p></div></div>' +
        '<div class="card">'+emptyState('building','No properties yet','Once properties are added to this portfolio, your value, progress and payment schedule will show up here.')+'</div>';
    }

    var due90 = state.milestones.filter(function(m){ var d = daysUntil(m.due_date); return m.status !== 'Paid' && d !== null && d >= 0 && d <= 90; });

    var resaleReady = state.properties.filter(function(p){ return resaleEligibility(p).eligible; });

          '<div class="hero-sub">'+plural(state.properties.length,'property','properties')+' · '+(portfolio ? esc(portfolio.name) : '')+'</div></div>' +
          ring(t.pct, 104, 10, '', 'paid') +
        '</div>' +
        barFill(t.pct, 'lg on-hero') .replace('class="bar lg on-hero"','class="bar lg on-hero" style="margin-top:22px"') +
        '<div class="hero-split">' +
          '<div class="hero-stat"><div class="k">Paid to date</div><div class="v">'+fmtCompact(t.paid)+'</div></div>' +
          '<div class="hero-stat"><div class="k">Remaining</div><div class="v">'+fmtCompact(t.pending)+'</div></div>' +
          '<div class="hero-stat"><div class="k">Next 90 days</div><div class="v">'+fmtCompact(sumAmt(due90))+'</div></div>' +
        '</div>' +
      '</section>';

    /* next payment */
    var nextCard;
    if(nextPay){
      var nd = daysUntil(nextPay.due_date), np = propOf(nextPay.property_id), ns = milestoneState(nextPay);
      var big = nd < 0 ? Math.abs(nd) : nd, unit = nd < 0 ? (Math.abs(nd) === 1 ? 'day late' : 'days late') : nd === 0 ? 'due today' : (nd === 1 ? 'day left' : 'days left');
      nextCard =
        '<section class="card next-card '+(ns==='overdue'?'overdue':ns==='soon'?'soon':'')+'" aria-label="Next payment">' +
          '<div class="next-eyebrow">'+icon('clock','',14,2)+' Next payment</div>' +
          '<div class="next-days"><b>'+big+'</b><span>'+unit+'</span></div>' +
          '<div class="next-amt">'+fmtMoney(mAmt(nextPay))+'</div>' +
          '<div class="next-what"><b>'+esc(np ? np.project_name : '')+'</b><br>'+esc(nextPay.milestone_event)+' · '+fmtDate(nextPay.due_date)+'</div>' +
          '<div class="next-foot"><button class="btn btn-ghost btn-sm" data-act="open-prop" data-id="'+esc(nextPay.property_id)+'">View property '+icon('arrowRight','',14,2)+'</button></div>' +
        '</section>';
    } else {
      nextCard = '<section class="card next-card"><div class="next-eyebrow">'+icon('clock','',14,2)+' Next payment</div>' +
        '<div class="all-clear" style="margin:auto"><div class="ok">'+icon('check','',22,2.4)+'</div>Nothing scheduled.<br>Every dated milestone is settled.</div></section>';
    }

    /* KPIs */
    var od = b.overdue;
    var kpis =
      '<div class="grid g-kpi">' +
        '<div class="card kpi"><div class="kpi-top"><span class="kpi-label">Paid to date</span><span class="kpi-ico good">'+icon('check','',16,2.2)+'</span></div><div class="kpi-value">'+fmtCompact(t.paid)+'</div><div class="kpi-sub">'+fmtPct(t.pct)+' of total value</div></div>' +
        '<div class="card kpi"><div class="kpi-top"><span class="kpi-label">Remaining</span><span class="kpi-ico accent">'+icon('wallet','',16)+'</span></div><div class="kpi-value">'+fmtCompact(t.pending)+'</div><div class="kpi-sub">across '+plural(b.overdue.length + b.soon.length + b.upcoming.length + b.undecided.length,'milestone')+'</div></div>' +
        '<button class="card kpi'+(od.length?' alert':'')+'" data-act="pay-tab" data-tab="'+(od.length?'overdue':'soon')+'"><div class="kpi-top"><span class="kpi-label">'+(od.length?'Overdue':'Due in 30 days')+'</span><span class="kpi-ico '+(od.length?'bad':'warn')+'">'+icon(od.length?'alert':'clock','',16)+'</span></div>' +
          '<div class="kpi-value">'+fmtCompact(sumAmt(od.length ? od : b.soon))+'</div><div class="kpi-sub">'+plural((od.length ? od : b.soon).length,'payment')+'</div></button>' +
        '<button class="card kpi" data-act="prop-filter-go" data-v="resale"><div class="kpi-top"><span class="kpi-label">Resale-ready</span><span class="kpi-ico good">'+icon('resale','',16)+'</span></div><div class="kpi-value">'+resaleReady.length+' <span style="font-size:14px;color:var(--ink-faint);font-family:Inter">of '+state.properties.length+'</span></div><div class="kpi-sub">eligible for resale NOC</div></button>' +

    /* cash-flow */
    var cols = cashflow(), maxAmt = Math.max.apply(null, cols.map(function(c){ return c.amt; }).concat([1]));

      return '<button class="cf-col'+(c.amt?'':' empty')+(c.kind==='od'?' od':'')+(c.kind==='later'?' later':'')+(state.cfSel===i?' sel':'')+'" data-act="cf" data-i="'+i+'" aria-label="'+esc(c.full)+': '+esc(fmtMoney(c.amt))+', '+plural(c.n,'payment')+'">' +
        '<span class="plot"><span class="b" style="height:'+(state.animate && !REDUCED ? 2 : h)+'%" data-h="'+h+'"></span></span><span class="l">'+esc(c.label)+'</span></button>';
    }).join('');
    var sel = state.cfSel != null ? cols[state.cfSel] : null;
    var readout = sel
      ? '<div class="big" id="cfBig">'+fmtMoney(sel.amt)+'</div><div class="lbl" id="cfLbl">'+esc(sel.full)+' · '+plural(sel.n,'payment')+'</div>'
      : '<div class="big" id="cfBig">'+fmtMoney(total12)+'</div><div class="lbl" id="cfLbl">due over the next 12 months</div>';
    var cashCard =
      '<section class="card" aria-label="Payment forecast">' +
        '<div class="card-head"><div><div class="card-title">Payment forecast</div><div class="card-sub">What is due, month by month. Tap a bar for details.</div></div></div>' +
        '<div class="cf"><div class="cf-readout">'+readout+'</div>' +
          '<div class="cf-scroll"><div class="cf-chart" id="cfChart">'+cfHtml+'</div></div></div>' +
      '</section>';

    /* attention */
    var items = [];
    if(b.overdue.length) items.push({ tone:'bad', ico:'alert', t: plural(b.overdue.length,'overdue payment'), s: fmtMoney(sumAmt(b.overdue)) + ' needs attention now', act:'pay-tab', data:'overdue' });
    if(b.soon.length) items.push({ tone:'warn', ico:'clock', t: plural(b.soon.length,'payment') + ' due within 30 days', s: fmtMoney(sumAmt(b.soon)) + ' total', act:'pay-tab', data:'soon' });
    if(b.undecided.length) items.push({ tone:'dim', ico:'calendar', t: plural(b.undecided.length,'milestone') + ' without a date', s:'Due dates are still to be confirmed', act:'pay-tab', data:'undecided' });
    if(resaleReady.length) items.push({ tone:'good', ico:'resale', t: plural(resaleReady.length,'unit') + ' resale-ready', s: resaleReady.slice(0,2).map(function(p){ return p.project_name; }).join(', ') + (resaleReady.length > 2 ? ' +' + (resaleReady.length-2) : ''), act:'prop-filter-go', data:'resale' });
    if(handovers.length) items.push({ tone:'info', ico:'developer', t:'Next handover: ' + handovers[0].project_name, s: fmtDate(handovers[0].handover_date) + ' · ' + relMonths(handovers[0].handover_date), act:'open-prop', data:handovers[0].id });
    var attHtml = items.length ? '<div class="att-list">' + items.map(function(i){
      return '<button class="att" data-act="'+i.act+'" data-tab="'+esc(i.data)+'" data-v="'+esc(i.data)+'" data-id="'+esc(i.data)+'"><span class="att-ico '+i.tone+'">'+icon(i.ico,'',18)+'</span><span><b>'+esc(i.t)+'</b><span class="s">'+esc(i.s)+'</span></span><span class="chev">'+icon('chevronRight','',16)+'</span></button>';

    /* allocation */
    var maxVal = Math.max.apply(null, state.properties.map(function(p){ return Number(p.total_unit_price_aed||0); }).concat([1]));
    var allocRows = state.properties.map(function(p){
      var paid = Number(p.total_paid_aed||0), pend = Number(p.total_pending_aed||0);
      return '<button class="alloc-row" data-act="open-prop" data-id="'+esc(p.id)+'"><div class="alloc-top"><span class="nm">'+esc(p.project_name)+'</span><span class="vl">'+fmtCompact(paid+pend)+' · '+Math.round(paidPct(p)*100)+'%</span></div>' +
        '<div style="display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);width:'+Math.max(8, Math.round((paid+pend)/maxVal*100))+'%">' +
        '<div style="width:'+(paid+pend > 0 ? paid/(paid+pend)*100 : 0)+'%;background:var(--accent)"></div><div style="flex:1;background:var(--surface-3)"></div></div></button>';
    }).join('');
    var allocCard = '<section class="card" aria-label="By property"><div class="card-head"><div><div class="card-title">By property</div><div class="card-sub">Bar length is relative to unit value</div></div><button class="link-btn" data-act="nav" data-to="properties">All '+icon('arrowRight','',14,2)+'</button></div>' +
      '<div class="alloc">' + allocRows + '<div class="alloc-legend"><span><span class="dot" style="background:var(--accent)"></span>Paid</span><span><span class="dot" style="background:var(--surface-3)"></span>Remaining</span></div></div></section>';

    /* upcoming */
    var upcoming = state.milestones.filter(function(m){ return m.status !== 'Paid'; }).sort(byDue).slice(0, 5);
    var upHtml = upcoming.length ? upcoming.map(function(m){ return paymentRow(m, false); }).join('')
      : emptyState('check','Nothing upcoming','Every milestone on this portfolio is settled.');
    var upCard = '<section class="card list-card" aria-label="Upcoming payments"><div class="card-head" style="padding-bottom:8px"><div><div class="card-title">Upcoming payments</div><div class="card-sub">Next '+upcoming.length+' by due date</div></div><button class="link-btn" data-act="nav" data-to="payments">View all '+icon('arrowRight','',14,2)+'</button></div>' + upHtml + '</section>';

    return (
      '<div class="page-head"><div><h1>'+greeting()+', '+esc(firstName(state.profile.full_name))+'</h1><p>Here is where your portfolio stands today'+(state.currency==='INR' ? ' · 1 AED = ₹'+esc(state.fxRate) : '')+'.</p></div></div>' +
      '<div class="grid g-hero">' + hero + nextCard + '</div>' +
      kpis +
      '<div class="grid g-two">' + cashCard + attCard + '</div>' +
      '<div class="grid g-two even">' + allocCard + upCard + '</div>'

  /* one payment row (used on dashboard + payments list) */
  function paymentRow(m, showDate){
    var p = propOf(m.property_id), st = milestoneState(m), d = daysUntil(m.due_date);
    var big, sub, cls = st === 'overdue' ? 'overdue' : st === 'soon' ? 'soon' : st === 'paid' ? 'paid' : '';
    if(st === 'paid'){ big = icon('check','',20,2.4); sub = 'PAID'; }
    else if(st === 'undecided'){ big = '—'; sub = 'TBC'; }
    else { big = Math.abs(d); sub = d < 0 ? 'LATE' : d === 0 ? 'TODAY' : d === 1 ? 'DAY' : 'DAYS'; }
    return '<button class="prow" data-act="open-prop" data-id="'+esc(m.property_id)+'" data-goto-sched="1">' +
      '<div class="datebox '+cls+'"><b>'+big+'</b><span>'+sub+'</span></div>' +
      '<div class="prow-info"><div class="prow-prop">'+esc(p ? p.project_name : '')+'</div><div class="prow-ms">'+esc(m.milestone_event)+(showDate !== false && m.due_date ? ' · '+fmtDate(m.due_date) : '')+'</div></div>' +
      '<div class="prow-amt"><b>'+fmtMoney(mAmt(m))+'</b><span>'+(m.due_date ? fmtDateShort(m.due_date) : 'Date TBC')+'</span></div>' +
    '</button>';
  }

  /* ---------------- PROPERTIES ---------------- */
  function filteredProperties(){
    var q = state.propQuery.trim().toLowerCase(), f = state.propFilter;
    var list = state.properties.filter(function(p){
      if(q){
        var hay = [p.project_name, p.developer, p.location, p.unit_type, p.unit_no].join(' ').toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      if(f === 'resale') return resaleEligibility(p).eligible;
      if(f !== 'all') return String(p.status) === f;
      return true;
    });
    var s = state.propSort;
    list.sort(function(a, b){
      if(s === 'value') return Number(b.total_unit_price_aed||0) - Number(a.total_unit_price_aed||0);
      if(s === 'progress') return paidPct(b) - paidPct(a);
      if(s === 'name') return String(a.project_name).localeCompare(String(b.project_name));
      return new Date(a.handover_date || '2099-01-01') - new Date(b.handover_date || '2099-01-01');
    });
    return list;
  }

  function propertyCard(p){
    var pct = paidPct(p), resale = resaleEligibility(p), nm = nextMilestone(p.id), ns = nm ? milestoneState(nm) : null;
    var nextHtml = nm
      ? '<div class="pcard-next '+(ns==='overdue'?'overdue':ns==='soon'?'soon':'')+'">'+icon(ns==='overdue'?'alert':'clock','ico-dim',16)+'<div class="t"><b>'+relDays(daysUntil(nm.due_date))+'</b> · '+esc(nm.milestone_event)+'</div><span class="mono" style="font-weight:600;font-size:12.5px">'+fmtCompact(mAmt(nm))+'</span></div>'
      : '<div class="pcard-next">'+icon('check','ico-dim',16)+'<div class="t">'+(Number(p.total_pending_aed) > 0 ? 'Remaining milestones have no date yet' : 'Fully paid')+'</div></div>';
    return '<button class="card pcard" data-act="open-prop" data-id="'+esc(p.id)+'" style="'+coverVars(p)+'">' +
      '<div class="pcard-cover"><span class="pill">'+esc(p.status || 'Property')+'</span>' + (resale.eligible ? '<span class="pill">'+icon('resale','',12,2)+' Resale ready</span>' : '') + '</div>' +
      '<div class="pcard-body">' +
        '<div><div class="pcard-name">'+esc(p.project_name)+'</div><div class="pcard-sub"><span class="meta-ico">'+icon('developer','ico-dim',13)+esc(p.developer||'—')+'</span><span class="meta-ico">'+icon('location','ico-dim',13)+esc(p.location||'—')+'</span></div></div>' +
        '<div class="facts"><span class="meta-ico">'+icon('bed','ico-dim',14)+'<b>'+esc(p.unit_type||'—')+'</b>'+(p.bedrooms?' · '+Math.trunc(p.bedrooms)+' BR':'')+'</span>' +
          '<span class="meta-ico">'+icon('calendar','ico-dim',14)+'Handover <b>'+(p.handover_date ? fmtDate(p.handover_date) : '—')+'</b></span></div>' +
        '<div class="pcard-prog"><div class="row"><span><b>'+fmtMoney(p.total_paid_aed)+'</b> paid</span><span>'+Math.round(pct*100)+'% of '+fmtCompact(p.total_unit_price_aed)+'</span></div>' + barFill(pct) + '</div>' +
        nextHtml +
      '</div></button>';
  }

  function propertyResults(){
    var list = filteredProperties();
    if(!list.length){
      return emptyState('search','No properties match','Try a different search or clear the filters.','<button class="btn btn-ghost btn-sm" data-act="clear-prop-filters">Clear filters</button>');
    }
    var value = list.reduce(function(a,p){ return a + Number(p.total_unit_price_aed||0); }, 0);
    var paid = list.reduce(function(a,p){ return a + Number(p.total_paid_aed||0); }, 0);
    return '<div class="card summary-strip">' +
        '<div><div class="k">Showing</div><div class="v">'+list.length+' of '+state.properties.length+'</div></div>' +
        '<div><div class="k">Total value</div><div class="v">'+fmtCompact(value)+'</div></div>' +
        '<div><div class="k">Paid</div><div class="v">'+fmtCompact(paid)+'</div></div>' +
        '<div><div class="k">Avg. progress</div><div class="v">'+Math.round(value > 0 ? paid/value*100 : 0)+'%</div></div>' +
      '</div>' +
      '<div class="prop-grid">' + list.map(propertyCard).join('') + '</div>';
  }

  function renderProperties(){
    if(!state.properties.length) return '<div class="page-head"><div><h1>Properties</h1></div></div><div class="card">'+emptyState('building','No properties yet','Properties added to this portfolio will appear here.')+'</div>';
    var statuses = []; state.properties.forEach(function(p){ if(p.status && statuses.indexOf(p.status) === -1) statuses.push(p.status); });
    var resaleN = state.properties.filter(function(p){ return resaleEligibility(p).eligible; }).length;
    function chip(id, label, n){ return '<button class="chip'+(state.propFilter===id?' active':'')+'" data-act="prop-filter" data-v="'+esc(id)+'">'+esc(label)+' <span class="n">'+n+'</span></button>'; }

      statuses.map(function(s){ return chip(s, s, state.properties.filter(function(p){ return p.status === s; }).length); }).join('') +

      '<div class="toolbar">' +
        '<div class="input-wrap has-ico grow">'+icon('search','',18)+'<input class="input" id="propSearch" type="search" placeholder="Search name, developer or location" value="'+esc(state.propQuery)+'" aria-label="Search properties"></div>' +
        '<select class="select" id="propSort" aria-label="Sort properties">' +
          [['handover','Handover: soonest'],['value','Value: highest'],['progress','Most paid'],['name','Name: A–Z']].map(function(o){ return '<option value="'+o[0]+'"'+(state.propSort===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('') +
        '</select></div>' +
      '<div class="chips" role="group" aria-label="Filter by status">'+chips+'</div>' +
      '<div id="propResults">'+propertyResults()+'</div>';
  }

  /* ---------------- PROPERTY DETAIL ---------------- */
  function renderDetail(){
    var p = propOf(state.route.id);
    if(!p) return '<div class="card">'+emptyState('search','Property not found','It may have been removed or belongs to another client.','<button class="btn" data-act="nav" data-to="properties">Back to properties</button>')+'</div>';
    var ms = state.milestones.filter(function(m){ return m.property_id === p.id; }).sort(function(a,b){ return (a.milestone_no||0) - (b.milestone_no||0); });
    var pct = paidPct(p), resale = resaleEligibility(p);
    var idx = state.properties.findIndex(function(x){ return x.id === p.id; });
    var nextP = state.properties[(idx + 1) % state.properties.length];

    var hoDays = daysUntil(p.handover_date);
    var pills = '<span class="pill">'+esc(p.status||'—')+'</span>' + (resale.eligible ? '<span class="pill good">'+icon('resale','',12,2)+' Resale ready</span>' : '') +
      (p.payment_plan ? '<span class="pill">'+esc(p.payment_plan)+'</span>' : '');

    var hero =
      '<section class="dhero" style="'+coverVars(p)+'">' +
        '<div class="dhero-top"><div style="min-width:0"><h1>'+esc(p.project_name)+'</h1>' +
          '<div class="loc"><span class="meta-ico">'+icon('developer','',15)+esc(p.developer||'—')+'</span><span class="meta-ico">'+icon('location','',15)+esc(p.location||'—')+'</span>'+(p.unit_no?'<span class="meta-ico">'+icon('home','',15)+'Unit '+esc(p.unit_no)+'</span>':'')+'</div>' +
          '<div class="pills">'+pills+'</div></div>' + ring(pct, 96, 9, '', 'paid') + '</div>' +
        '<div class="dstats">' +
          '<div class="dstat"><div class="k">Unit price</div><div class="v">'+fmtCompact(p.total_unit_price_aed)+'</div></div>' +
          '<div class="dstat"><div class="k">Paid</div><div class="v">'+fmtCompact(p.total_paid_aed)+'</div></div>' +
          '<div class="dstat"><div class="k">Remaining</div><div class="v">'+fmtCompact(p.total_pending_aed)+'</div></div>' +
          '<div class="dstat"><div class="k">Handover</div><div class="v">'+(p.handover_date ? (hoDays >= 0 ? relMonths(p.handover_date).replace(/^in /,'') : 'Handed over') : '—')+'</div></div>' +
        '</div>' +
      '</section>';

      '<div class="crumbs"><button data-act="nav" data-to="properties">'+icon('arrowLeft','',16,2)+' Properties</button><span>/</span><span class="cur">'+esc(p.project_name)+'</span></div>' +
      hero + tabs + '<div id="detailBody">' + content + '</div>' +
      (state.properties.length > 1 ? '<div style="display:flex;justify-content:flex-end;margin-top:22px"><button class="btn btn-ghost" data-act="open-prop" data-id="'+esc(nextP.id)+'">Next: '+esc(nextP.project_name)+' '+icon('arrowRight','',16,2)+'</button></div>' : '')
    );
  }

  function kvRows(rows){ return '<div class="kv">' + rows.map(function(r){ return '<div class="kv-row"><div class="k">'+r[0]+'</div><div class="v">'+r[1]+'</div></div>'; }).join('') + '</div>'; }

  function renderOverview(p, ms, resale){
    var cur = state.currency;
    var owners = '';
    [[p.owner1_name, p.owner1_pct],[p.owner2_name, p.owner2_pct]].forEach(function(o){
      if(o[0]) owners += '<span class="owner-chip"><span class="av">'+esc(initials(o[0]))+'</span>'+esc(o[0])+' <span>'+Math.round((o[1]||0)*100)+'%</span></span>';
    });

    var unit = [
      ['Type', esc(p.unit_type||'—') + (p.bedrooms ? ' · '+Math.trunc(p.bedrooms)+' BR' : '')],
      ['Size (BUA)', p.size_sqft ? Math.round(p.size_sqft).toLocaleString('en-US')+' sqft' : '—']
    ];
    if(p.plot_sqft) unit.push(['Plot', Math.round(p.plot_sqft).toLocaleString('en-US')+' sqft']);
    unit.push(['Unit no.', esc(p.unit_no||'—')], ['Purchased', fmtDate(p.purchase_date)], ['Handover', fmtDate(p.handover_date)], ['Payment plan', esc(p.payment_plan||'—')]);

    var pricing = [];
    if(p.unit_price_aed && Number(p.unit_price_aed) !== Number(p.total_unit_price_aed)) pricing.push(['Base price', fmtMoney(p.unit_price_aed)]);
    pricing.push(['Total unit price', fmtMoney(p.total_unit_price_aed)]);
    if(fmtPsf(p.ppsf_bua)) pricing.push(['Price per sqft (BUA)', fmtPsf(p.ppsf_bua)]);
    if(fmtPsf(p.ppsf_plot)) pricing.push(['Price per sqft (plot)', fmtPsf(p.ppsf_plot)]);
    if(p.accelerated_payment_aed != null && Number(p.accelerated_payment_aed) > 0) pricing.push(['Accelerated payment', fmtPct(p.accelerated_payment_pct)+' · '+fmtMoney(p.accelerated_payment_aed)]);

    var phases = [
      ['During construction', p.equity_construction_pct, p.equity_construction_aed, 'var(--accent)'],
      ['On handover', p.equity_handover_pct, p.equity_handover_aed, 'var(--info)'],
      ['Post-handover', p.equity_posthandover_pct, p.equity_posthandover_aed, 'var(--warn)']
    ].filter(function(r){ return r[1] != null && Number(r[1]) > 0; });
    var structure = phases.length
      ? '<div class="kv" style="padding-bottom:18px"><div class="stack-bar" role="img" aria-label="Payment structure">' + phases.map(function(r){ return '<i style="width:'+Number(r[1])*100+'%;background:'+r[3]+'"></i>'; }).join('') + '</div>' +
        '<div class="stack-legend">' + phases.map(function(r){ return '<span><span class="dot" style="background:'+r[3]+'"></span>'+r[0]+' <b>'+fmtPct(r[1])+'</b> · '+fmtMoney(r[2])+'</span>'; }).join('') + '</div></div>'
      : '';

    var callout;
    if(!resale.applicable) callout = '<div class="callout"><span class="c-ico">'+icon('resale','',18)+'</span><div><b>Not resale-applicable</b><p>This unit\'s contract does not permit resale at this stage.</p></div></div>';
    else if(resale.eligible) callout = '<div class="callout good"><span class="c-ico">'+icon('resale','',20)+'</span><div><b>Resale ready</b><p>'+fmtPct(resale.paidPct)+' paid, above the '+fmtPct(resale.reqPct)+' required for a resale NOC.</p></div></div>';
    else {
      var need = Math.max(0, resale.reqPct * Number(p.total_unit_price_aed||0) - Number(p.total_paid_aed||0));
      callout = '<div class="callout"><span class="c-ico">'+icon('resale','',18)+'</span><div style="flex:1"><b>Not yet eligible to sell</b><p>'+fmtPct(resale.paidPct)+' paid — needs '+fmtPct(resale.reqPct)+' for a resale NOC. About '+fmtMoney(need)+' more to go.</p>' +
        '<div style="margin-top:10px">'+barFill(resale.reqPct > 0 ? Math.min(1, resale.paidPct / resale.reqPct) : 0)+'</div></div></div>';
    }

    return '<div class="d-grid">' +
      '<div class="card"><div class="section-h">'+icon('building','',14)+' Unit details</div>'+kvRows(unit) +
        (owners ? '<div class="section-h">'+icon('users','',14)+' Ownership</div><div class="kv" style="padding-bottom:12px">'+owners+'</div>' : '') + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:14px">' +
        '<div class="card"><div class="section-h">'+icon('money','',14)+' Pricing</div>'+kvRows(pricing) +
          (structure ? '<div class="section-h">'+icon('percent','',14)+' Payment structure</div>'+structure : '') + '</div>' +
        '<div class="card"><div class="section-h">'+icon('resale','',14)+' Resale</div>'+callout+'</div>' +
        ((p.offer_notes || p.remarks) ? '<div class="card"><div class="section-h">'+icon('info','',14)+' Notes</div>' +
          (p.offer_notes ? '<div class="note"><b style="color:var(--ink)">Offer / discount</b><br>'+esc(p.offer_notes)+'</div>' : '') +
          (p.remarks ? '<div class="note"><b style="color:var(--ink)">Remarks</b><br>'+esc(p.remarks)+'</div>' : '') + '</div>' : '') +
      '</div></div>';
  }

  function renderSchedule(p, ms){
    if(!ms.length) return '<div class="card">'+emptyState('calendar','No milestones on file','Payment milestones for this unit will show up here once they are added.')+'</div>';
    var cur = state.currency, b = bucketMilestones(ms);
    var nextId = (ms.filter(function(m){ return m.status !== 'Paid' && m.due_date; }).sort(byDue)[0] || {}).id;
    var totals = ms.reduce(function(acc, m){
      acc.amount += Number(m.amount_aed||0); acc.vat += Number(m.vat_aed||0); acc.total += Number(m.total_aed||0);
      acc.paid += Number(m.paid_aed||0); acc.out += Number(m.outstanding_aed||0); return acc;
    }, { amount:0, vat:0, total:0, paid:0, out:0 });

    var head =
      '<div class="tl-head"><div><div class="card-title">'+b.paid.length+' of '+ms.length+' milestones paid</div><div class="card-sub">'+fmtMoney(p.total_paid_aed)+' paid · '+fmtMoney(p.total_pending_aed)+' remaining'+(b.overdue.length ? ' · <b style="color:var(--bad)">'+b.overdue.length+' overdue</b>' : '')+'</div></div>' +
      '<div class="seg" role="group" aria-label="Schedule view">' +
        '<button data-act="tl-view" data-v="timeline" class="'+(state.tlView==='timeline'?'active':'')+'">'+icon('timeline','',15)+' Timeline</button>' +
        '<button data-act="tl-view" data-v="table" class="'+(state.tlView==='table'?'active':'')+'">'+icon('table','',15)+' Table</button></div></div>';

    if(state.tlView === 'table'){
      var rows = ms.map(function(m){
        var st = milestoneState(m), d = daysUntil(m.due_date);
        return '<tr><td class="num">'+(m.milestone_no!=null ? Math.round(m.milestone_no*10)/10 : '—')+'</td><td class="wrap">'+esc(m.milestone_event)+'</td>' +
          '<td>'+fmtDate(m.sale_date)+'</td><td>'+(m.due_date ? fmtDate(m.due_date) : 'Not confirmed')+'</td><td>'+esc(m.installment_code||'—')+'</td>' +
          '<td class="num">'+fmtPct(m.pct)+'</td><td class="num">'+fmtMoney(m.amount_aed)+'</td><td class="num">'+fmtMoney(m.vat_aed)+'</td><td class="num">'+fmtMoney(m.total_aed)+'</td>' +
          '<td class="num">'+fmtMoney(m.paid_aed)+'</td><td class="num">'+fmtMoney(m.outstanding_aed)+'</td><td>'+(m.year||'—')+'</td>' +
          '<td><span class="st '+st+'">'+(st==='overdue' ? Math.abs(d)+'d overdue' : STATE_LABEL[st])+'</span></td><td class="wrap">'+esc(m.remarks||'—')+'</td></tr>';
      }).join('');
      return head + '<div class="sheet-wrap"><table class="sheet wide"><thead><tr><th>#</th><th>Milestone</th><th>Sale date</th><th>Due date</th><th>Installment</th><th class="num">%</th><th class="num">Amount</th><th class="num">VAT</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Outstanding</th><th>Year</th><th>Status</th><th>Remarks</th></tr></thead>' +
        '<tbody>'+rows+'</tbody><tfoot><tr><td colspan="6">Total</td><td class="num">'+fmtMoney(totals.amount)+'</td><td class="num">'+fmtMoney(totals.vat)+'</td><td class="num">'+fmtMoney(totals.total)+'</td><td class="num">'+fmtMoney(totals.paid)+'</td><td class="num">'+fmtMoney(totals.out)+'</td><td colspan="2"></td></tr></tfoot></table></div>' +
        '<div class="sheet-hint">Scroll sideways to see every column.</div>';
    }

    var items = ms.map(function(m, i){
      var st = milestoneState(m), d = daysUntil(m.due_date), isNext = m.id === nextId;
      var when = m.due_date ? fmtDate(m.due_date) : 'Date to be confirmed';
      var status = st === 'overdue' ? Math.abs(d) + 'd overdue' : isNext && st !== 'overdue' ? relDays(d) : STATE_LABEL[st];
      var pillCls = st === 'upcoming' && !isNext ? '' : (STATE_PILL[st] || (isNext ? 'accent' : ''));
      return '<div class="tl-item '+st+(isNext?' next':'')+'"><div class="tl-rail"><span class="tl-node">'+(st==='paid' ? icon('check','',12,3.2) : '')+'</span><span class="tl-line"></span></div>' +
        '<details class="tl-card"'+(isNext ? ' open' : '')+'><summary>' +
          '<div class="tl-main"><div class="tl-title">'+esc(m.milestone_event)+'</div><div class="tl-meta"><span class="pill '+(isNext && st!=='overdue' ? 'accent' : pillCls)+'">'+esc(status)+'</span><span>'+esc(when)+'</span>'+(m.pct!=null ? '<span>'+fmtPct(m.pct)+' of price</span>' : '')+'</div></div>' +
          '<div class="tl-amt"><b>'+fmtMoney(m.amount_aed)+'</b><span>+ VAT '+fmtCompact(m.vat_aed)+'</span></div></summary>' +
        '<div class="tl-more">' +
          '<div><div class="k">Total incl. VAT</div><div class="v mono">'+fmtMoney(m.total_aed)+'</div></div>' +
          '<div><div class="k">Paid</div><div class="v mono">'+fmtMoney(m.paid_aed)+'</div></div>' +
          '<div><div class="k">Outstanding</div><div class="v mono">'+fmtMoney(m.outstanding_aed)+'</div></div>' +
          '<div><div class="k">Installment</div><div class="v">'+esc(m.installment_code||'—')+'</div></div>' +
          '<div><div class="k">Sale date</div><div class="v">'+fmtDate(m.sale_date)+'</div></div>' +
          '<div><div class="k">Milestone no.</div><div class="v">'+(m.milestone_no!=null ? Math.round(m.milestone_no*10)/10 : '—')+'</div></div>' +
          (m.remarks ? '<div class="full"><div class="k">Remarks</div><div class="v">'+esc(m.remarks)+'</div></div>' : '') +
        '</div></details></div>';
    }).join('');
    return head + '<div class="card"><div class="tl">'+items+'</div></div>';
  }

  /* ---------------- PAYMENTS ---------------- */
  var PAY_TABS = [
    { id:'overdue', label:'Overdue', empty:['check','Nothing overdue','You are fully up to date on payments.'] },
    { id:'soon', label:'Due soon', empty:['calendar','Nothing due in 30 days','No payments are falling due in the next month.'] },
    { id:'upcoming', label:'Upcoming', empty:['calendar','Nothing further out','There are no dated milestones beyond the next 30 days.'] },
    { id:'undecided', label:'Date TBC', empty:['check','Every milestone is dated','Nothing is waiting on a confirmed due date.'] },
    { id:'paid', label:'Paid', empty:['wallet','No payments recorded','Paid milestones will be listed here.'] }
  ];
  function milestoneYear(m){ return m.year || (m.due_date ? Number(m.due_date.slice(0,4)) : null); }
  function paymentsFiltered(){
    var q = state.payQuery.trim().toLowerCase();
    return state.milestones.filter(function(m){
      if(state.payYear !== 'all' && String(milestoneYear(m)) !== String(state.payYear)) return false;
      if(state.payProp !== 'all' && m.property_id !== state.payProp) return false;
      if(q){
        var p = propOf(m.property_id);
        if([m.milestone_event, p ? p.project_name : '', m.remarks].join(' ').toLowerCase().indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function paymentsResults(){
    var b = bucketMilestones(paymentsFiltered());
    var tab = PAY_TABS.some(function(t){ return t.id === state.payTab; }) ? state.payTab : 'soon';
    var list = b[tab].slice().sort(byDue); if(tab === 'paid') list.reverse();
    var def = PAY_TABS.filter(function(t){ return t.id === tab; })[0];
    if(!list.length){
      var filtered = state.payQuery || state.payYear !== 'all' || state.payProp !== 'all';
      return '<div class="card">'+ (filtered ? emptyState('search','No payments match','Nothing in this tab fits the current search or filters.','<button class="btn btn-ghost btn-sm" data-act="clear-pay-filters">Clear filters</button>') : emptyState(def.empty[0], def.empty[1], def.empty[2])) + '</div>';
    }
    var meta = '<div class="results-meta"><span>'+plural(list.length,'payment')+' · <b class="mono" style="color:var(--ink)">'+fmtMoney(sumAmt(list))+'</b></span>' +
      '<span><button class="link-btn" data-act="export">'+icon('download','',14,2)+' Export CSV</button></span></div>';

    if(state.payView === 'table'){
      var rows = list.map(function(m){
        var p = propOf(m.property_id), st = milestoneState(m), d = daysUntil(m.due_date);
        return '<tr class="clickable" data-act="open-prop" data-id="'+esc(m.property_id)+'" data-goto-sched="1"><td><b>'+esc(p?p.project_name:'')+'</b></td><td class="wrap">'+esc(m.milestone_event)+'</td>' +
          '<td>'+(m.due_date ? fmtDate(m.due_date) : 'Not confirmed')+'</td><td><span class="st '+st+'">'+(st==='overdue' ? Math.abs(d)+'d overdue' : STATE_LABEL[st])+'</span></td>' +
          '<td class="num">'+fmtMoney(m.amount_aed)+'</td><td class="num">'+fmtMoney(m.vat_aed)+'</td><td class="num">'+fmtMoney(m.total_aed)+'</td></tr>';
      }).join('');
      var tot = list.reduce(function(a,m){ a.amt += Number(m.amount_aed||0); a.vat += Number(m.vat_aed||0); a.tot += Number(m.total_aed||0); return a; }, { amt:0, vat:0, tot:0 });
      return meta + '<div class="sheet-wrap"><table class="sheet wide" style="min-width:820px"><thead><tr><th>Property</th><th>Milestone</th><th>Due</th><th>Status</th><th class="num">Amount</th><th class="num">VAT</th><th class="num">Total</th></tr></thead><tbody>'+rows+'</tbody>' +
        '<tfoot><tr><td colspan="4">Total</td><td class="num">'+fmtMoney(tot.amt)+'</td><td class="num">'+fmtMoney(tot.vat)+'</td><td class="num">'+fmtMoney(tot.tot)+'</td></tr></tfoot></table></div>';
    }

    // grouped by month
    var groups = [], map = {};
    list.forEach(function(m){
      var key = m.due_date ? m.due_date.slice(0,7) : 'none';
      if(!map[key]){
        var label = key === 'none' ? 'No date yet' : new Date(m.due_date + 'T00:00:00').toLocaleDateString('en-GB', { month:'long', year:'numeric' });
        map[key] = { label:label, items:[] }; groups.push(map[key]);
      }
      map[key].items.push(m);
    });
    return meta + '<div class="card list-card">' + groups.map(function(g){
      return '<div class="month-head"><span>'+esc(g.label)+' · '+plural(g.items.length,'payment')+'</span><span class="sum">'+fmtMoney(sumAmt(g.items))+'</span></div>' + g.items.map(function(m){ return paymentRow(m, false); }).join('');
    }).join('') + '</div>';
  }

  function renderPayments(){
    var years = {}; state.milestones.forEach(function(m){ var y = milestoneYear(m); if(y) years[y] = true; });
    var yearList = Object.keys(years).map(Number).sort(function(a,b){ return a-b; });
    var b = bucketMilestones(paymentsFiltered());
    var tab = PAY_TABS.some(function(t){ return t.id === state.payTab; }) ? state.payTab : 'soon';

    var stats = PAY_TABS.map(function(t){
      return '<button class="stat t-'+t.id+(t.id===tab?' active':'')+'" data-act="pay-tab-local" data-tab="'+t.id+'" aria-pressed="'+(t.id===tab)+'"><div class="top"><i></i>'+esc(t.label)+'</div><div class="amt">'+fmtCompact(sumAmt(b[t.id]))+'</div><div class="cnt">'+plural(b[t.id].length,'payment')+'</div></button>';
    }).join('');

    return '<div class="page-head"><div><h1>Payments</h1><p>Every milestone across your portfolio, in one place.</p></div>' +
        '<div class="seg" role="group" aria-label="View"><button data-act="pay-view" data-v="list" class="'+(state.payView==='list'?'active':'')+'">'+icon('list','',15)+' List</button><button data-act="pay-view" data-v="table" class="'+(state.payView==='table'?'active':'')+'">'+icon('table','',15)+' Table</button></div></div>' +
      '<div class="statgrid" id="payStats">'+stats+'</div>' +
      '<div class="toolbar">' +
        '<div class="input-wrap has-ico grow">'+icon('search','',18)+'<input class="input" id="paySearch" type="search" placeholder="Search milestone or property" value="'+esc(state.payQuery)+'" aria-label="Search payments"></div>' +
        '<select class="select" id="payProp" aria-label="Filter by property"><option value="all">All properties</option>' +
          state.properties.map(function(p){ return '<option value="'+esc(p.id)+'"'+(state.payProp===p.id?' selected':'')+'>'+esc(p.project_name)+'</option>'; }).join('') + '</select>' +
        '<select class="select" id="payYear" aria-label="Filter by year"><option value="all">All years</option>' +
          yearList.map(function(y){ return '<option value="'+y+'"'+(String(state.payYear)===String(y)?' selected':'')+'>'+y+'</option>'; }).join('') + '</select>' +
      '</div>' +
      '<div id="payResults">'+paymentsResults()+'</div>';
  }

  function refreshPayments(){
    var r = document.getElementById('payResults'), s = document.getElementById('payStats');
    if(!r || !s) return render();
    var b = bucketMilestones(paymentsFiltered());
    var tab = PAY_TABS.some(function(t){ return t.id === state.payTab; }) ? state.payTab : 'soon';
    s.innerHTML = PAY_TABS.map(function(t){
      return '<button class="stat t-'+t.id+(t.id===tab?' active':'')+'" data-act="pay-tab-local" data-tab="'+t.id+'" aria-pressed="'+(t.id===tab)+'"><div class="top"><i></i>'+esc(t.label)+'</div><div class="amt">'+fmtCompact(sumAmt(b[t.id]))+'</div><div class="cnt">'+plural(b[t.id].length,'payment')+'</div></button>';
    }).join('');
    r.innerHTML = paymentsResults();
  }

  function exportCsv(){
    var list = paymentsFiltered().filter(function(m){ return milestoneState(m) === (PAY_TABS.some(function(t){ return t.id === state.payTab; }) ? state.payTab : 'soon'); }).sort(byDue);
    if(!list.length){ toast('Nothing to export'); return; }
    function q(v){ v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
    var head = ['Property','Developer','Milestone no.','Milestone','Due date','Status','Amount (AED)','VAT (AED)','Total (AED)','Paid (AED)','Outstanding (AED)'];
    var rows = list.map(function(m){
      var p = propOf(m.property_id) || {};
      return [p.project_name, p.developer, m.milestone_no, m.milestone_event, m.due_date, STATE_LABEL[milestoneState(m)], m.amount_aed, m.vat_aed, m.total_aed, m.paid_aed, m.outstanding_aed].map(q).join(',');
    });
    var blob = new Blob(['﻿' + [head.join(',')].concat(rows).join('\n')], { type:'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'ledger-payments-' + state.payTab + '-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    toast('Exported ' + plural(list.length, 'payment'));
  }

  /* ---------------- ACCOUNT ---------------- */

        : '<div class="access-row"><span class="avatar" style="width:34px;height:34px;font-size:12px">'+esc(initials(pf.name))+'</span><span class="nm">'+esc(pf.name)+'</span><span class="pill good">Member</span></div>';
